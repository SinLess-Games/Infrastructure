---
# =============================================================================
# Bootstrap OS Packages
# -----------------------------------------------------------------------------
# Purpose:
#   Baseline packages used by scripts/initialize-repo.sh or local bootstrap
#   automation before Homebrew, Ansible, Terraform, and Kubernetes tooling are
#   fully installed.
#
# Notes:
#   - Debian/Ubuntu package name is build-essential, not build-essentials.
#   - Keep this list small. Repo tooling belongs in Brewfile or Ansible roles.
# =============================================================================

packages:
  # ---------------------------------------------------------------------------
  # Build tooling
  # ---------------------------------------------------------------------------
  - build-essential
  - gcc
  - g++
  - make
  - pkg-config

  # ---------------------------------------------------------------------------
  # Source control
  # ---------------------------------------------------------------------------
  - git

  # ---------------------------------------------------------------------------
  # Network / download utilities
  # ---------------------------------------------------------------------------
  - curl
  - wget
  - ca-certificates
  - gnupg
  - lsb-release

  # ---------------------------------------------------------------------------
  # DNS / network diagnostics
  # ---------------------------------------------------------------------------
  - dnsutils
  - iproute2
  - iputils-ping
  - net-tools

  # ---------------------------------------------------------------------------
  # Data tooling
  # ---------------------------------------------------------------------------
  - jq
  - unzip
  - tar

  # ---------------------------------------------------------------------------
  # Python bootstrap
  # ---------------------------------------------------------------------------
  - python3
  - python3-venv
  - python3-pip
  - python3-apt

  # ---------------------------------------------------------------------------
  # Shell / local automation helpers
  # ---------------------------------------------------------------------------
  - sudo
  - software-properties-common