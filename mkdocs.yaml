# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
# ==============================================================================
# SinLess Games Infrastructure Docs
# ==============================================================================
#
# Production MkDocs configuration for the Infrastructure repository.
#
# Build:
#   mkdocs build --clean --strict
#
# Serve locally:
#   mkdocs serve -a 127.0.0.1:8000
#
# Docs root:
#   Docs/
#
# Output:
#   site/
# ==============================================================================

# ------------------------------------------------------------------------------
# Core site metadata
# ------------------------------------------------------------------------------

site_name: SinLess Games Infrastructure Docs
site_description: Architecture, operations, platform, network, Kubernetes, GitOps, and infrastructure documentation for the Infrastructure repository.
site_author: SinLess Games LLC
site_url: https://docs.sinlessgames.com

repo_url: https://github.com/Sinless777/Infrastructure
repo_name: Sinless777/Infrastructure
edit_uri: edit/main/Docs/

docs_dir: Docs
site_dir: site
use_directory_urls: true
strict: true

# Files under Docs/ that should not be published as static site assets.
exclude_docs: |
  Dockerfile
  nginx.conf
  requirements.txt

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------

theme:
  name: material
  language: en

  favicon: Network/Rack-Diagram.svg
  logo: Network/Rack-Diagram.svg

  # Keep the docs site self-contained and avoid external font calls.
  font: false

  icon:
    repo: fontawesome/brands/github
    logo: material/server-network

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer

    # Table of contents
    - toc.follow

    # Search
    - search.highlight
    - search.share
    - search.suggest

    # Code blocks
    - content.code.copy
    - content.code.select
    - content.code.annotate

    # Page actions
    - content.action.edit
    - content.action.view

    # Content tabs
    - content.tabs.link

# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - skip-lightbox

  - git-revision-date-localized:
      type: timeago
      timezone: America/Boise
      locale: en
      enable_creation_date: true
      fallback_to_build_date: true

  - redirects:
      redirect_maps: {}

  - macros:
      on_error_fail: true
      on_undefined: strict

  - include-markdown:
      preserve_includer_indent: true
      dedent: false
      comments: false

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        reduce_boolean_attributes: true
        remove_empty_space: true

# ------------------------------------------------------------------------------
# Markdown extensions
# ------------------------------------------------------------------------------

markdown_extensions:
  # Python Markdown built-ins
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables

  - toc:
      permalink: true
      toc_depth: 2-4
      title: On this page

  # PyMdown extensions
  - pymdownx.betterem:
      smart_enable: all

  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true

  - pymdownx.inlinehilite
  - pymdownx.keys

  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Sinless777
      repo: Infrastructure

  - pymdownx.smartsymbols

  - pymdownx.snippets:
      base_path:
        - Docs
      check_paths: true

  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

# ------------------------------------------------------------------------------
# Extra metadata / template variables
# ------------------------------------------------------------------------------

extra:
  generator: false

  project:
    name: Infrastructure
    owner: SinLess Games LLC
    repository: Sinless777/Infrastructure
    production_domain: docs.sinlessgames.com
    public_domain: sinlessgames.com
    local_domain: local.sinlessgames.com

  infrastructure:
    primary_local_domain: local.sinlessgames.com
    public_domains:
      - sinlessgames.com
      - helixaibot.com
    environments:
      - dev
      - staging
      - prod

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sinless777/Infrastructure
      name: Infrastructure repository on GitHub

# ------------------------------------------------------------------------------
# Assets
# ------------------------------------------------------------------------------

extra_css:
  - assets/stylesheets/extra.css

# ------------------------------------------------------------------------------
# Copyright
# ------------------------------------------------------------------------------

copyright: Copyright &copy; SinLess Games LLC

