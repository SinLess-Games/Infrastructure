# Kubernetes/apps/prod/gitops/config/externalsecret-argocd-admin.yaml
#
# Replaces the bcrypt hash that used to be committed in the Argo CD Helm
# values. Helm createSecret is false, so this object must exist before the
# Argo CD server can authenticate the admin user.
#
# Vault key kubernetes/production/integrations must contain:
#   argocd_admin_password_bcrypt  - bcrypt hash, not the plaintext password
#   argocd_admin_password_mtime   - RFC3339 timestamp of the last rotation
#
# Do not sync this until those fields exist and the previously committed
# admin password has been rotated. Git history still has the old hash.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: gitops
  labels:
    app.kubernetes.io/name: argocd-admin
    app.kubernetes.io/component: admin-credentials
    app.kubernetes.io/part-of: argocd
    security.sinlessgames.io/secret-source: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          app.kubernetes.io/name: argocd-admin
          app.kubernetes.io/component: admin-credentials
          app.kubernetes.io/part-of: argocd
          security.sinlessgames.io/managed-by: external-secrets
      data:
        admin.password: "{{ .adminPasswordBcrypt }}"
        admin.passwordMtime: "{{ .adminPasswordMtime }}"
  data:
    - secretKey: adminPasswordBcrypt
      remoteRef:
        key: kubernetes/production/integrations
        property: argocd_admin_password_bcrypt
    - secretKey: adminPasswordMtime
      remoteRef:
        key: kubernetes/production/integrations
        property: argocd_admin_password_mtime
