configs:
  params:
    # Keep the Argo CD API on HTTP behind the mesh.
    #
    # argocd.sinlessgames.com is served by Istio. The applied VirtualService
    # (Kubernetes/apps/prod/gitops/config/virtualservice-argocd-ui.yaml) routes
    # to argo-cd-argocd-server port 80, and the DestinationRule uses
    # ISTIO_MUTUAL. Edge TLS terminates at the gateway, not in the Argo
    # process. Setting server.insecure to false makes the process speak
    # HTTPS and breaks that HTTP/port-80 route. Do not flip this until the
    # VirtualService targets the Argo HTTPS port and the server has its own
    # certificate.
    server.insecure: true

  cm:
    admin.enabled: true

  secret:
    # Helm must not own argocd-secret. ExternalSecret argocd-admin in
    # Kubernetes/apps/prod/gitops/config/ writes admin.password from Vault.
    # Do not commit a bcrypt hash. The hash previously stored here has to
    # be rotated; git history still contains it.
    createSecret: false

networkPolicy:
  create: true
  defaultDenyIngress: true

server:
  ingress:
    enabled: false

controller:
  replicas: 1
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true

redisSecretInit:
  enabled: false