# Kubernetes/apps/prod/sinless-games/mailu/values.yaml

domain: sinlessgames.com

hostnames:
  - mail.sinlessgames.com

timezone: America/Boise
clusterDomain: cluster.local
subnet: 10.42.0.0/16

# Do not put the secret key directly in values.yaml.
# Secret must contain:
#   secret-key: <rotated-random-value>
existingSecret: mailu-secrets

initialAccount:
  enabled: true
  username: tpierce
  domain: sinlessgames.com

  # Do not put the password directly in values.yaml.
  # Secret must contain:
  #   password: <rotated-random-password>
  existingSecret: mailu-initial-account
  existingSecretPasswordKey: password

  # Safer than constantly resetting the account on each Helm sync.
  mode: ifmissing

postmaster: postmaster
recipientDelimiter: "+"

credentialRounds: 12
sessionCookieSecure: true
sessionTimeout: 3600
permanentSessionLifetime: 604800

limits:
  messageSizeLimitInMegabytes: 50
  authRatelimit:
    ip: 30/hour
    ipv4Mask: 24
    ipv6Mask: 56
    user: 50/day
    exemptionLength: 86400
    exemption: ""
  messageRatelimit:
    value: 100/day
    exemption: ""

persistence:
  single_pvc: true
  size: 50Gi
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce

networkPolicy:
  enabled: true
  ingressController:
    namespace: istio-system
    podSelector: |
      matchLabels:
        istio: ingress
  monitoring:
    namespace: monitoring
    podSelector: |
      matchLabels:
        app.kubernetes.io/name: prometheus

ingress:
  enabled: true
  ingressClassName: istio
  tls: true
  selfSigned: false

  # Prefer a real cert-manager/Cloudflare-issued TLS secret.
  # This should match the cert secret used for mail.sinlessgames.com.
  existingSecret: wildcard-sinlessgames-com

  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: Mailu
    gethomepage.dev/icon: mailu.png
    gethomepage.dev/description: "Mail admin"
    gethomepage.dev/href: https://mail.sinlessgames.com

    security.sinlessgames.io/exposure: public
    security.sinlessgames.io/ingress: istio
    security.sinlessgames.io/backend-mtls: istio-strict

  realIpHeader: X-Forwarded-For
  realIpFrom: ""

roundcube:
  enabled: false

webmail:
  enabled: false

front:
  kind: Deployment
  replicaCount: 1

  # Front is the public mail edge. Pin it to the node that owns the mail IP.
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  hostPort:
    enabled: true

  externalService:
    enabled: false

  podLabels:
    security.sinlessgames.io/exposure: public-mail-edge
    security.sinlessgames.io/hostport-required: "true"

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-edge"
    security.sinlessgames.io/reason: "Public SMTP/IMAP/Submission protocols must preserve client IP and are not mesh-mTLS protocols."

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  terminationGracePeriodSeconds: 30

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

admin:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  # Keep cluster DNS enabled.
  # Mailu components must be able to resolve internal Kubernetes services.
  # If DNSSEC validation is still needed, solve it at CoreDNS/upstream DNS
  # instead of bypassing Kubernetes DNS inside the admin pod.
  dnsPolicy: ClusterFirst

  extraEnvVars:
    - name: ADMIN_ADDRESS
      value: mailu-admin.sinless-games.svc.cluster.local
    - name: REDIS_ADDRESS
      value: mailu-redis-master.sinless-games.svc.cluster.local
    - name: RATELIMIT_STORAGE_URL
      value: redis://mailu-redis-master.sinless-games.svc.cluster.local:6379/2
    - name: QUOTA_STORAGE_URL
      value: redis://mailu-redis-master.sinless-games.svc.cluster.local:6379/1

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-admin

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-admin"
    security.sinlessgames.io/reason: "Mailu internal services use their own protocol and service-discovery wiring."

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  startupProbe:
    enabled: true
    failureThreshold: 60
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  livenessProbe:
    enabled: true
    failureThreshold: 6
    initialDelaySeconds: 120
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  readinessProbe:
    enabled: true
    failureThreshold: 18
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

postfix:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-smtp

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

dovecot:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-imap

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

rspamd:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  # Rspamd waits on Mailu Admin during startup. These explicit DNS names avoid
  # brittle ClusterIP references and make the dependency path obvious.
  extraEnvVars:
    - name: ADMIN_ADDRESS
      value: mailu-admin.sinless-games.svc.cluster.local
    - name: REDIS_ADDRESS
      value: mailu-redis-master.sinless-games.svc.cluster.local
    - name: ANTISPAM_ADDRESS
      value: mailu-rspamd.sinless-games.svc.cluster.local

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-antispam

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"
    security.sinlessgames.io/reason: "Rspamd must directly reach Mailu Admin during startup."

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  startupProbe:
    enabled: true
    failureThreshold: 90
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  livenessProbe:
    enabled: true
    failureThreshold: 6
    initialDelaySeconds: 180
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5

  readinessProbe:
    enabled: true
    failureThreshold: 30
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

clamav:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-antivirus

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  extraVolumeMounts:
    - name: clamav-run
      mountPath: /run/clamav

  extraVolumes:
    - name: clamav-run
      emptyDir:
        sizeLimit: 64Mi

  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi

oletools:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-document-scanner

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

tika:
  nodeSelector:
    kubernetes.io/hostname: rke2-prod-wk-02

  updateStrategy:
    type: Recreate

  podLabels:
    security.sinlessgames.io/exposure: cluster-internal
    security.sinlessgames.io/component: mail-text-extraction

  podAnnotations:
    sidecar.istio.io/inject: "false"
    security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

redis:
  enabled: true
  architecture: standalone

  auth:
    enabled: false

  master:
    nodeSelector:
      kubernetes.io/hostname: rke2-prod-wk-02

    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi

    podLabels:
      security.sinlessgames.io/exposure: cluster-internal
      security.sinlessgames.io/component: mail-redis

    podAnnotations:
      sidecar.istio.io/inject: "false"
      security.sinlessgames.io/istio-sidecar: "disabled-mail-internal"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi