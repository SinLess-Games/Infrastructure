# Kubernetes/apps/prod/networking/cloudflared/podmonitor-cloudflared-sinlessgames.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared-sinlessgames
  namespace: networking
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: sinlessgames
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: edge-access
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - networking

  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: sinlessgames
      app.kubernetes.io/component: tunnel

  podTargetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/instance
    - app.kubernetes.io/component
    - app.kubernetes.io/part-of
    - security.sinlessgames.io/zone

  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true