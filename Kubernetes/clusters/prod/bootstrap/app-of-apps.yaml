# Kubernetes/clusters/prod/bootstrap/app-of-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform-root
  namespace: gitops
  labels:
    app.kubernetes.io/name: prod-platform-root
    app.kubernetes.io/instance: prod
    app.kubernetes.io/component: app-of-apps
    app.kubernetes.io/part-of: sinless-games-platform
    app.kubernetes.io/managed-by: argocd
    topology.kubernetes.io/environment: prod
    security.sinlessgames.io/gitops-root: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
    security.sinlessgames.io/purpose: "Root Argo CD app-of-apps for the production platform."
    security.sinlessgames.io/repo: "SinLess-Games/Infrastructure"
    security.sinlessgames.io/branch: "main"
    security.sinlessgames.io/path: "Kubernetes/apps/prod/gitops/applications"
    security.sinlessgames.io/prune-enabled: "true"
    security.sinlessgames.io/self-heal-enabled: "true"
    security.sinlessgames.io/root-finalizer-enabled: "false"
    security.sinlessgames.io/deletion-policy: "Deleting this root Application should
      not directly cascade-delete all child resources."

spec:
  project: platform

  source:
    repoURL: https://github.com/SinLess-Games/Infrastructure.git
    targetRevision: main
    path: Kubernetes/apps/prod/gitops/applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops

  revisionHistoryLimit: 10

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    retry:
      limit: 6
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

    syncOptions:
      # Namespaces should be explicit manifests with labels, quotas, and policy controls.
      - CreateNamespace=false

      # Production-safe pruning behavior.
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Delete=false

      # Cleaner sync behavior.
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

      # Safer apply behavior for large CRDs and modern Kubernetes resources.
      - ServerSideApply=true
      - Validate=true

      # Avoid shared-resource ownership conflicts between root and child apps.
      - FailOnSharedResource=true
