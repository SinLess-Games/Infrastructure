# Kubernetes/clusters/prod/bootstrap/project-platform.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: gitops
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: argocd-project
    app.kubernetes.io/part-of: sinless-games-platform
    app.kubernetes.io/managed-by: argocd
    topology.kubernetes.io/environment: prod
    security.sinlessgames.io/gitops-project: platform
  annotations:
    security.sinlessgames.io/purpose: "Restrict production platform GitOps sources,
      destinations, and resource kinds."
    security.sinlessgames.io/cluster-admin-equivalent: "platform-bootstrap-restricted"
spec:
  description: Production platform workloads for the RKE2 production cluster

  sourceNamespaces:
    - gitops

  sourceRepos:
    # Main infrastructure repositories.
    - https://github.com/SinLess-Games/Infrastructure.git
    - https://github.com/Sinless777/Infrastructure.git

    # Core networking.
    - https://helm.cilium.io
    - https://istio-release.storage.googleapis.com/charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - https://cloudflare.github.io/helm-charts

    # GitOps / delivery / automation.
    - https://argoproj.github.io/argo-helm
    - https://actions-runner-controller.github.io/actions-runner-controller
    - https://kedacore.github.io/charts
    - https://raw.githubusercontent.com/karmada-io/karmada/master/charts

    # Storage / registry / data.
    - https://charts.longhorn.io
    - https://helm.goharbor.io
    - https://charts.bitnami.com/bitnami
    - https://nats-io.github.io/k8s/helm/charts/
    - https://qdrant.github.io/qdrant-helm
    - https://charts.cockroachdb.com/

    # GPU.
    - https://helm.ngc.nvidia.com/nvidia

    # Observability.
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://kiali.org/helm-charts
    - https://opencost.github.io/opencost-helm-chart

    # Security.
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno
    - https://falcosecurity.github.io/charts
    - https://aquasecurity.github.io/helm-charts
    - https://crowdsecurity.github.io/helm-charts
    - https://defectdojo.github.io/django-DefectDojo/charts
    - https://vmware-tanzu.github.io/helm-charts
    - https://wazuh.github.io/wazuh-kubernetes

    # Platform / business applications.
    - https://releases.rancher.com/server-charts/stable
    - https://backstage.github.io/charts
    - https://mailu.github.io/helm-charts
    - https://community-charts.github.io/helm-charts
    - https://jameswynn.github.io/helm-charts
    - https://kokuwaio.github.io/helm-charts

  destinations:
    # GitOps / Argo CD.
    - server: https://kubernetes.default.svc
      namespace: gitops

    # Core Kubernetes / networking.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: networking
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: external-secrets

    # GitOps / automation.
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: argo-events
    - server: https://kubernetes.default.svc
      namespace: argo-workflows
    - server: https://kubernetes.default.svc
      namespace: actions-runner-system
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: karmada-system

    # Storage / registry / data.
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: nats
    - server: https://kubernetes.default.svc
      namespace: redis
    - server: https://kubernetes.default.svc
      namespace: garage

    # GPU.
    - server: https://kubernetes.default.svc
      namespace: nvidia-gpu-operator

    # Observability.
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kiali
    - server: https://kubernetes.default.svc
      namespace: opentelemetry-operator-system
    - server: https://kubernetes.default.svc
      namespace: opencost

    # Security / compliance.
    - server: https://kubernetes.default.svc
      namespace: security
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: trivy-system
    - server: https://kubernetes.default.svc
      namespace: crowdsec
    - server: https://kubernetes.default.svc
      namespace: defectdojo
    - server: https://kubernetes.default.svc
      namespace: dfir-iris
    - server: https://kubernetes.default.svc
      namespace: wazuh
    - server: https://kubernetes.default.svc
      namespace: velero

    # Management / developer platform.
    - server: https://kubernetes.default.svc
      namespace: cattle-system
    - server: https://kubernetes.default.svc
      namespace: backstage

    # Business / user-facing apps.
    - server: https://kubernetes.default.svc
      namespace: sinless-games
    - server: https://kubernetes.default.svc
      namespace: helix-ai
    - server: https://kubernetes.default.svc
      namespace: mailu
    - server: https://kubernetes.default.svc
      namespace: n8n
    - server: https://kubernetes.default.svc
      namespace: homepage

  clusterResourceWhitelist:
    # Namespaces.
    - group: ""
      kind: Namespace

    # CRDs.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    # Cluster RBAC required by platform controllers.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    # Admission webhooks.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    # API aggregation.
    - group: apiregistration.k8s.io
      kind: APIService

    # Storage/platform objects.
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotContent
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: node.k8s.io
      kind: RuntimeClass

    # Cert-manager.
    - group: cert-manager.io
      kind: ClusterIssuer

    # External Secrets.
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: external-secrets.io
      kind: ClusterExternalSecret
    - group: external-secrets.io
      kind: ClusterPushSecret
    - group: external-secrets.io
      kind: ClusterGenerator

    # Kyverno.
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: ClusterCleanupPolicy
    - group: kyverno.io
      kind: PolicyException
    - group: kyverno.io
      kind: GlobalContextEntry

    # Cilium cluster-wide resources.
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumBGPClusterConfig
    - group: cilium.io
      kind: CiliumBGPAdvertisement
    - group: cilium.io
      kind: CiliumBGPNodeConfigOverride
    - group: cilium.io
      kind: CiliumNodeConfig

    # Gateway API.
    - group: gateway.networking.k8s.io
      kind: GatewayClass

    # Argo Rollouts / Workflows.
    - group: argoproj.io
      kind: ClusterAnalysisTemplate
    - group: argoproj.io
      kind: ClusterWorkflowTemplate

    # KEDA.
    - group: keda.sh
      kind: ClusterTriggerAuthentication

    # NVIDIA GPU Operator.
    - group: nvidia.com
      kind: ClusterPolicy

    # Karmada.
    - group: cluster.karmada.io
      kind: Cluster
    - group: policy.karmada.io
      kind: ClusterPropagationPolicy
    - group: policy.karmada.io
      kind: ClusterOverridePolicy
    - group: config.karmada.io
      kind: ResourceInterpreterWebhookConfiguration

    # Trivy Operator cluster reports.
    - group: aquasecurity.github.io
      kind: ClusterVulnerabilityReport
    - group: aquasecurity.github.io
      kind: ClusterConfigAuditReport
    - group: aquasecurity.github.io
      kind: ClusterRbacAssessmentReport
    - group: aquasecurity.github.io
      kind: ClusterInfraAssessmentReport
    - group: aquasecurity.github.io
      kind: ClusterComplianceReport
    - group: aquasecurity.github.io
      kind: ClusterSbomReport

  namespaceResourceWhitelist:
    # Argo CD.
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet

    # Core namespaced resources.
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: Endpoints
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Pod
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota

    # Workloads.
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: ReplicaSet

    # Jobs.
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob

    # Autoscaling / disruption control.
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget

    # RBAC.
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    # Kubernetes networking.
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress

    # Gateway API.
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: HTTPSRoute
    - group: gateway.networking.k8s.io
      kind: TLSRoute
    - group: gateway.networking.k8s.io
      kind: TCPRoute
    - group: gateway.networking.k8s.io
      kind: UDPRoute
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant

    # Istio networking / security / telemetry.
    - group: networking.istio.io
      kind: Gateway
    - group: networking.istio.io
      kind: VirtualService
    - group: networking.istio.io
      kind: DestinationRule
    - group: networking.istio.io
      kind: ServiceEntry
    - group: networking.istio.io
      kind: Sidecar
    - group: networking.istio.io
      kind: EnvoyFilter
    - group: networking.istio.io
      kind: WorkloadEntry
    - group: networking.istio.io
      kind: WorkloadGroup
    - group: networking.istio.io
      kind: ProxyConfig
    - group: security.istio.io
      kind: PeerAuthentication
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: security.istio.io
      kind: RequestAuthentication
    - group: telemetry.istio.io
      kind: Telemetry
    - group: extensions.istio.io
      kind: WasmPlugin

    # Cert-manager.
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer

    # External Secrets.
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: PushSecret

    # ExternalDNS CRD source support.
    - group: externaldns.k8s.io
      kind: DNSEndpoint

    # Monitoring / Prometheus Operator.
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusAgent
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Probe
    - group: monitoring.coreos.com
      kind: ScrapeConfig
    - group: monitoring.coreos.com
      kind: ThanosRuler

    # OpenTelemetry.
    - group: opentelemetry.io
      kind: OpenTelemetryCollector
    - group: opentelemetry.io
      kind: Instrumentation
    - group: opentelemetry.io
      kind: OpAMPBridge

    # Kyverno namespaced policy.
    - group: kyverno.io
      kind: Policy
    - group: kyverno.io
      kind: CleanupPolicy

    # Cilium namespaced resources.
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: cilium.io
      kind: CiliumEnvoyConfig
    - group: cilium.io
      kind: CiliumEgressGatewayPolicy
    - group: cilium.io
      kind: CiliumLocalRedirectPolicy

    # KEDA.
    - group: keda.sh
      kind: ScaledObject
    - group: keda.sh
      kind: ScaledJob
    - group: keda.sh
      kind: TriggerAuthentication

    # Argo Rollouts.
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: AnalysisRun
    - group: argoproj.io
      kind: Experiment

    # Argo Workflows.
    - group: argoproj.io
      kind: Workflow
    - group: argoproj.io
      kind: WorkflowTemplate
    - group: argoproj.io
      kind: CronWorkflow

    # Argo Events.
    - group: argoproj.io
      kind: EventBus
    - group: argoproj.io
      kind: EventSource
    - group: argoproj.io
      kind: Sensor

    # Longhorn.
    - group: longhorn.io
      kind: Volume
    - group: longhorn.io
      kind: Engine
    - group: longhorn.io
      kind: Replica
    - group: longhorn.io
      kind: EngineImage
    - group: longhorn.io
      kind: Node
    - group: longhorn.io
      kind: Setting
    - group: longhorn.io
      kind: InstanceManager
    - group: longhorn.io
      kind: ShareManager
    - group: longhorn.io
      kind: BackingImage
    - group: longhorn.io
      kind: BackingImageManager
    - group: longhorn.io
      kind: BackingImageDataSource
    - group: longhorn.io
      kind: BackupTarget
    - group: longhorn.io
      kind: BackupVolume
    - group: longhorn.io
      kind: Backup
    - group: longhorn.io
      kind: Snapshot
    - group: longhorn.io
      kind: RecurringJob
    - group: longhorn.io
      kind: Orphan
    - group: longhorn.io
      kind: SupportBundle
    - group: longhorn.io
      kind: SystemBackup
    - group: longhorn.io
      kind: SystemRestore

    # Volume snapshots.
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshot
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotContent

    # Velero.
    - group: velero.io
      kind: BackupStorageLocation
    - group: velero.io
      kind: VolumeSnapshotLocation
    - group: velero.io
      kind: Schedule
    - group: velero.io
      kind: Backup
    - group: velero.io
      kind: Restore
    - group: velero.io
      kind: DeleteBackupRequest
    - group: velero.io
      kind: DownloadRequest
    - group: velero.io
      kind: PodVolumeBackup
    - group: velero.io
      kind: PodVolumeRestore
    - group: velero.io
      kind: ServerStatusRequest

    # Trivy Operator namespaced reports.
    - group: aquasecurity.github.io
      kind: VulnerabilityReport
    - group: aquasecurity.github.io
      kind: ConfigAuditReport
    - group: aquasecurity.github.io
      kind: RbacAssessmentReport
    - group: aquasecurity.github.io
      kind: InfraAssessmentReport
    - group: aquasecurity.github.io
      kind: ExposedSecretReport
    - group: aquasecurity.github.io
      kind: SbomReport

    # Karmada namespaced policy resources.
    - group: policy.karmada.io
      kind: PropagationPolicy
    - group: policy.karmada.io
      kind: OverridePolicy
    - group: policy.karmada.io
      kind: FederatedResourceQuota
    - group: work.karmada.io
      kind: ResourceBinding

  namespaceResourceBlacklist:
    # Raw ServiceAccount token artifacts should not be managed directly by GitOps.
    - group: ""
      kind: ServiceAccountToken

  orphanedResources:
    warn: true

  roles: []
