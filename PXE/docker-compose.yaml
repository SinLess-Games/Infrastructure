---
name: pxe

services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest
    container_name: netbootxyz
    hostname: netbootxyz
    restart: unless-stopped
    init: true

    environment:
      TZ: "${TZ:-America/Boise}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

      # Pin the menu separately from the container image so the boot menu is
      # reproducible even when the image is refreshed.
      MENU_VERSION: "${NETBOOTXYZ_MENU_VERSION:-2.0.89}"

      # Internal container service ports.
      NGINX_PORT: "80"
      WEB_APP_PORT: "3000"

      # Keep TFTP predictable for PXE/firewall/NAT behavior.
      TFTPD_OPTS: "--tftp-single-port --tftp-no-blocksize"

      # DHCP/DNS is handled outside this container.
      DISABLE_DNSMASQ: "1"

    ports:
      # Web configuration UI
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host

      # TFTP for PXE boot
      - target: 69
        published: 69
        protocol: udp
        mode: host

      # Static boot assets served by nginx
      - target: 80
        published: 80
        protocol: tcp
        mode: host

    volumes:
      - type: bind
        source: ./config
        target: /config

      - type: bind
        source: ./assets
        target: /assets

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:3000/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      app.kubernetes.io/name: netbootxyz
      app.kubernetes.io/component: pxe
      app.kubernetes.io/part-of: infrastructure
      sinlessgames.io/service: pxe
      sinlessgames.io/environment: local

    security_opt:
      - no-new-privileges:true