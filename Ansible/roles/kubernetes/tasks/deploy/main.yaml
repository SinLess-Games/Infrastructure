---
# =============================================================================
# Kubernetes Production Cluster Deployment
# =============================================================================

- name: Ensure generated directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ kubernetes_generated_dir }}"
    - "{{ kubernetes_generated_env_dir }}"
    - "{{ kubernetes_role_generated_snippets_dir }}"
    - "{{ kubernetes_role_generated_logs_dir }}"
  delegate_to: localhost
  run_once: true

- name: Normalize Kubernetes operation flags from CLI aliases
  ansible.builtin.set_fact:
    kubernetes_operation: >-
      {{
        kubernetes_operation
        | combine(
            {
              'plan_only': (kubernetes_plan_only | default(kubernetes_operation.plan_only) | bool),
              'destroy': (kubernetes_destroy | default(kubernetes_operation.destroy) | bool),
              'force_apply': (kubernetes_force_apply | default(kubernetes_operation.force_apply | default(false)) | bool)
            },
            recursive=True
          )
      }}
  delegate_to: localhost
  run_once: true

- name: Build Kubernetes deployment node lists
  ansible.builtin.set_fact:
    kubernetes_role_all_nodes: "{{ kubernetes_nodes.control_plane + kubernetes_nodes.workers }}"
    kubernetes_gpu_passthrough_nodes: >-
      {{
        kubernetes_nodes.workers
        | selectattr('gpu_passthrough_devices', 'defined')
        | selectattr('gpu_passthrough_devices')
        | list
      }}
  delegate_to: localhost
  run_once: true

- name: Build Kubernetes deployment validation values
  ansible.builtin.set_fact:
    kubernetes_role_all_node_vmids: "{{ kubernetes_role_all_nodes | map(attribute='vmid') | list }}"
    kubernetes_role_all_node_ips: "{{ kubernetes_role_all_nodes | map(attribute='ip') | list }}"
    kubernetes_role_all_node_names: "{{ kubernetes_role_all_nodes | map(attribute='name') | list }}"
    kubernetes_role_all_node_target_nodes: "{{ kubernetes_role_all_nodes | map(attribute='target_node') | list }}"
    kubernetes_gpu_passthrough_hosts: "{{ kubernetes_gpu_passthrough_nodes | map(attribute='target_node') | unique | list }}"
  delegate_to: localhost
  run_once: true

- name: Validate Kubernetes production VM layout
  ansible.builtin.assert:
    that:
      - kubernetes_nodes.control_plane | length == kubernetes_control_plane.count | int
      - kubernetes_nodes.workers | length == kubernetes_workers.count | int
      - kubernetes_master_ips | length == kubernetes_control_plane.count | int
      - kubernetes_worker_ips | length == kubernetes_workers.count | int
      - kubernetes_role_all_node_vmids | unique | length == kubernetes_role_all_node_vmids | length
      - kubernetes_role_all_node_ips | unique | length == kubernetes_role_all_node_ips | length
      - kubernetes_role_all_node_names | unique | length == kubernetes_role_all_node_names | length
      - kubernetes_role_all_node_target_nodes | difference(kubernetes_proxmox_target_nodes) | length == 0
      - kubernetes_control_plane.memory_balloon_mb | int == 0
      - kubernetes_workers.memory_balloon_mb | int == 0
    fail_msg: >-
      Kubernetes production VM layout is unsafe or inconsistent. Check node counts,
      duplicate VMIDs, duplicate IPs, target_node values, and memory ballooning.
  delegate_to: localhost
  run_once: true

- name: Validate GPU passthrough worker definitions
  ansible.builtin.assert:
    that:
      - item.gpu_passthrough_devices | length > 0
      - item.target_node is defined
      - item.vmid is defined
      - item.name is defined
    fail_msg: >-
      GPU passthrough worker {{ item.name | default('unknown') }} is missing
      gpu_passthrough_devices, target_node, vmid, or name.
  loop: "{{ kubernetes_gpu_passthrough_nodes }}"
  loop_control:
    label: "{{ item.name | default('unknown-gpu-worker') }}"
  delegate_to: localhost
  run_once: true
  when: kubernetes_gpu_passthrough_nodes | length > 0

- name: Build Terraform module target arguments
  ansible.builtin.set_fact:
    kubernetes_role_terraform_target_args: >-
      {{
        [
          '-target=module.kubernetes_prod_control_plane',
          '-target=module.kubernetes_prod_workers'
        ]
        if kubernetes_environment == 'prod'
        else [
          '-target=module.kubernetes_' ~ (kubernetes_environment | replace('-', '_')) ~ '_master',
          '-target=module.kubernetes_' ~ (kubernetes_environment | replace('-', '_')) ~ '_worker'
        ]
      }}
  delegate_to: localhost
  run_once: true

- name: Render control plane cloud-init snippets
  ansible.builtin.template:
    src: "{{ kubernetes_templates_dir }}/cloud-init-master.yaml.j2"
    dest: "{{ kubernetes_role_generated_snippets_dir }}/{{ item.name }}-cloud-init.yaml"
    mode: "0644"
  loop: "{{ kubernetes_nodes.control_plane }}"
  loop_control:
    index_var: node_index
    label: "{{ item.name }}"
  vars:
    kubernetes_default_user: "{{ kubernetes_ansible.default_user }}"
  delegate_to: localhost
  run_once: true

- name: Render worker cloud-init snippets
  ansible.builtin.template:
    src: "{{ kubernetes_templates_dir }}/cloud-init-worker.yaml.j2"
    dest: "{{ kubernetes_role_generated_snippets_dir }}/{{ item.name }}-cloud-init.yaml"
    mode: "0644"
  loop: "{{ kubernetes_nodes.workers }}"
  loop_control:
    index_var: node_index
    label: "{{ item.name }}"
  vars:
    kubernetes_default_user: "{{ kubernetes_ansible.default_user }}"
  delegate_to: localhost
  run_once: true

- name: Render Terraform for Kubernetes cluster
  ansible.builtin.template:
    src: "{{ kubernetes_templates_dir }}/{{ kubernetes_role_terraform_template }}"
    dest: "{{ kubernetes_role_generated_tf_file }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Check for Proxmox API token file
  ansible.builtin.stat:
    path: "{{ kubernetes_deploy_proxmox_api_token_file }}"
  register: kubernetes_proxmox_api_token_file_stat
  delegate_to: localhost
  run_once: true

- name: Assert Proxmox API token file exists
  ansible.builtin.assert:
    that:
      - kubernetes_proxmox_api_token_file_stat.stat.exists | default(false)
    fail_msg: >-
      Missing Proxmox API token file at {{ kubernetes_deploy_proxmox_api_token_file }}.
      Generate or refresh the Terraform automation token before deploying Kubernetes.
  delegate_to: localhost
  run_once: true

- name: Read Proxmox API token file
  ansible.builtin.slurp:
    src: "{{ kubernetes_deploy_proxmox_api_token_file }}"
  register: kubernetes_proxmox_api_token_file_content
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Decode Proxmox API token file text
  ansible.builtin.set_fact:
    kubernetes_proxmox_api_token_file_text: "{{ kubernetes_proxmox_api_token_file_content.content | b64decode }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Extract Proxmox API token ID
  ansible.builtin.shell: |
    set -euo pipefail
    awk -F= '/^FULL_TOKENID=/{print $2; exit}' "{{ kubernetes_deploy_proxmox_api_token_file }}"
  args:
    executable: /bin/bash
  register: kubernetes_terraform_proxmox_api_token_id_result
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

- name: Extract Proxmox API token secret
  ansible.builtin.shell: |
    set -euo pipefail
    awk -F= '/^TOKEN_SECRET=/{print $2; exit}' "{{ kubernetes_deploy_proxmox_api_token_file }}"
  args:
    executable: /bin/bash
  register: kubernetes_terraform_proxmox_api_token_secret_result
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

- name: Build Terraform runtime credentials
  ansible.builtin.set_fact:
    kubernetes_terraform_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id_result.stdout | trim }}"
    kubernetes_terraform_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret_result.stdout | trim }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Assert Terraform runtime credentials are complete
  ansible.builtin.assert:
    that:
      - kubernetes_terraform_proxmox_api_token_id | length > 0
      - kubernetes_terraform_proxmox_api_token_secret | length > 0
      - kubernetes_deploy_proxmox_api_url | length > 0
      - kubernetes_operation.destroy | bool or kubernetes_deploy_ssh_keys | length > 0
    fail_msg: "Terraform runtime credentials or SSH keys are incomplete for Kubernetes deployment."
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Upload cloud-init snippets to Proxmox local storage via API
  ansible.builtin.uri:
    url: "{{ kubernetes_proxmox.api_url | regex_replace('/+$', '') }}/nodes/{{ item.target_node }}/storage/local/upload"
    method: POST
    headers:
      Authorization: >-
        PVEAPIToken={{ kubernetes_terraform_proxmox_api_token_id }}={{ kubernetes_terraform_proxmox_api_token_secret }}
    validate_certs: "{{ not (kubernetes_deploy_proxmox_tls_insecure | bool) }}"
    body_format: form-multipart
    body:
      content: snippets
      filename:
        filename: "{{ kubernetes_role_generated_snippets_dir }}/{{ item.name }}-cloud-init.yaml"
        mime_type: text/yaml
    status_code: 200
    return_content: true
  loop: "{{ kubernetes_role_all_nodes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: true
  no_log: true
  when:
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool
    - kubernetes_cicustom_user_snippet_enabled | default(false) | bool

- name: Clear stale Proxmox VM locks before Terraform apply
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - ConnectTimeout=5
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - root@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] }}
      - /bin/bash
      - -c
      - |
        set -eu
        set -o pipefail
        vmid="{{ item.vmid }}"
        if [ -f "/etc/pve/qemu-server/${vmid}.conf" ]; then
          timeout 5 /usr/sbin/qm unlock "${vmid}" 2>/dev/null || true
        fi
        rm -f "/var/lock/qemu-server/lock-${vmid}.conf"
  loop: "{{ kubernetes_role_all_nodes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  throttle: 2
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  register: stale_lock_cleanup_result
  when:
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool

- name: Clear orphaned Proxmox cloud-init volumes before Terraform apply
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - ConnectTimeout=5
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - root@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] }}
      - /bin/bash
      - -c
      - |
        set -eu
        set -o pipefail
        vmid="{{ item.vmid }}"
        storage="{{ item.storage | default(kubernetes_proxmox.storage_by_node[item.target_node] | default(kubernetes_proxmox.storage)) }}"
        volume="vm-${vmid}-cloudinit"

        # Remove stale cloud-init volume references from the configured storage ID.
        timeout 10 /usr/sbin/pvesm free "${storage}:${volume}" >/dev/null 2>&1 || true

        # Fallback for stale LVs that are no longer visible through pvesm metadata.
        for vg in $(/usr/sbin/vgs --noheadings -o vg_name 2>/dev/null | awk '{print $1}'); do
          if timeout 5 /usr/sbin/lvs --noheadings -o lv_name "${vg}" 2>/dev/null | awk '{print $1}' | grep -Fxq "${volume}"; then
            timeout 10 /usr/sbin/lvremove -fy "${vg}/${volume}" >/dev/null 2>&1 || true
          fi
        done
  loop: "{{ kubernetes_role_all_nodes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  throttle: 2
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  register: orphan_cloudinit_cleanup_result
  when:
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool

- name: Clear orphaned Proxmox cloud-init volumes via API before Terraform apply
  ansible.builtin.uri:
    url: >-
      {{ kubernetes_proxmox.api_url | regex_replace('/+$', '') }}/nodes/{{ item.target_node }}/storage/{{ item.storage | default(kubernetes_proxmox.storage_by_node[item.target_node] | default(kubernetes_proxmox.storage)) }}/content/vm-{{ item.vmid }}-cloudinit
    method: DELETE
    headers:
      Authorization: >-
        PVEAPIToken={{ kubernetes_terraform_proxmox_api_token_id }}={{ kubernetes_terraform_proxmox_api_token_secret }}
    validate_certs: "{{ not (kubernetes_deploy_proxmox_tls_insecure | bool) }}"
    status_code:
      - 200
      - 404
      - 500
  loop: "{{ kubernetes_role_all_nodes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  no_log: true
  register: orphan_cloudinit_cleanup_api_result
  when:
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool

- name: Initialize Terraform working directory
  ansible.builtin.command:
    argv:
      - terraform
      - -chdir={{ kubernetes_terraform_dir }}
      - init
  delegate_to: localhost
  run_once: true
  changed_when: false
  environment:
    TF_VAR_proxmox_api_url: "{{ kubernetes_deploy_proxmox_api_url }}"
    TF_VAR_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id }}"
    TF_VAR_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret }}"
    TF_VAR_proxmox_tls_insecure: "{{ kubernetes_deploy_proxmox_tls_insecure | bool | ternary('true', 'false') }}"
    TF_VAR_kubernetes_ssh_keys: "{{ kubernetes_deploy_ssh_keys | to_json }}"
  no_log: true

- name: Plan Terraform cluster resources
  ansible.builtin.command:
    argv: "{{ ['terraform', '-chdir=' ~ kubernetes_terraform_dir, 'plan', '-no-color'] + kubernetes_role_terraform_target_args }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  when:
    - kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool
  environment:
    TF_VAR_proxmox_api_url: "{{ kubernetes_deploy_proxmox_api_url }}"
    TF_VAR_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id }}"
    TF_VAR_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret }}"
    TF_VAR_proxmox_tls_insecure: "{{ kubernetes_deploy_proxmox_tls_insecure | bool | ternary('true', 'false') }}"
    TF_VAR_kubernetes_ssh_keys: "{{ kubernetes_deploy_ssh_keys | to_json }}"

- name: Plan Terraform cluster destroy
  ansible.builtin.command:
    argv: "{{ ['terraform', '-chdir=' ~ kubernetes_terraform_dir, 'plan', '-destroy', '-no-color'] + kubernetes_role_terraform_target_args }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  when:
    - kubernetes_operation.plan_only | bool
    - kubernetes_operation.destroy | bool
  environment:
    TF_VAR_proxmox_api_url: "{{ kubernetes_deploy_proxmox_api_url }}"
    TF_VAR_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id }}"
    TF_VAR_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret }}"
    TF_VAR_proxmox_tls_insecure: "{{ kubernetes_deploy_proxmox_tls_insecure | bool | ternary('true', 'false') }}"
    TF_VAR_kubernetes_ssh_keys: "{{ kubernetes_deploy_ssh_keys | to_json }}"

- name: Apply Terraform cluster plan
  ansible.builtin.command:
    argv: "{{ ['terraform', '-chdir=' ~ kubernetes_terraform_dir, 'apply', '-auto-approve', '-no-color'] + kubernetes_role_terraform_target_args }}"
  delegate_to: localhost
  run_once: true
  async: 14400
  poll: 15
  when:
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool
  environment:
    TF_VAR_proxmox_api_url: "{{ kubernetes_deploy_proxmox_api_url }}"
    TF_VAR_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id }}"
    TF_VAR_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret }}"
    TF_VAR_proxmox_tls_insecure: "{{ kubernetes_deploy_proxmox_tls_insecure | bool | ternary('true', 'false') }}"
    TF_VAR_kubernetes_ssh_keys: "{{ kubernetes_deploy_ssh_keys | to_json }}"

- name: Destroy Terraform cluster resources
  ansible.builtin.command:
    argv: "{{ ['terraform', '-chdir=' ~ kubernetes_terraform_dir, 'destroy', '-auto-approve', '-no-color'] + kubernetes_role_terraform_target_args }}"
  delegate_to: localhost
  run_once: true
  async: 14400
  poll: 15
  when:
    - not kubernetes_operation.plan_only | bool
    - kubernetes_operation.destroy | bool
  environment:
    TF_VAR_proxmox_api_url: "{{ kubernetes_deploy_proxmox_api_url }}"
    TF_VAR_proxmox_api_token_id: "{{ kubernetes_terraform_proxmox_api_token_id }}"
    TF_VAR_proxmox_api_token_secret: "{{ kubernetes_terraform_proxmox_api_token_secret }}"
    TF_VAR_proxmox_tls_insecure: "{{ kubernetes_deploy_proxmox_tls_insecure | bool | ternary('true', 'false') }}"
    TF_VAR_kubernetes_ssh_keys: "{{ kubernetes_deploy_ssh_keys | to_json }}"

# =============================================================================
# GPU Passthrough Management
# =============================================================================
# This supports the full production layout where GPU devices are assigned from
# each worker definition:
#
#   kubernetes_nodes.workers[].gpu_passthrough_devices
#
# Example:
#   rke2-prod-wk-01 -> NVidia-1060
#   rke2-prod-wk-02 -> Nvidia-3060
#
# It replaces the previous single dedicated GPU worker behavior that expected
# one VM to receive both GPU mappings.

- name: Determine whether GPU passthrough management is requested
  ansible.builtin.set_fact:
    kubernetes_gpu_passthrough_requested: >-
      {{
        (kubernetes_gpu_passthrough_nodes | length > 0)
        and not (kubernetes_operation.plan_only | bool)
        and not (kubernetes_operation.destroy | bool)
      }}
  delegate_to: localhost
  run_once: true

- name: Check SSH access for GPU passthrough Proxmox hosts
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - ConnectTimeout=5
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) ~ '@' ~ (kubernetes_proxmox.node_ssh_hosts[item] | default(item)) }}"
      - true
  loop: "{{ kubernetes_gpu_passthrough_hosts }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  register: kubernetes_gpu_proxmox_ssh_access_checks
  when: kubernetes_gpu_passthrough_requested | bool

- name: Build GPU passthrough SSH failure list
  ansible.builtin.set_fact:
    kubernetes_gpu_passthrough_ssh_failed_hosts: >-
      {{
        kubernetes_gpu_proxmox_ssh_access_checks.results
        | default([])
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}
  delegate_to: localhost
  run_once: true
  when: kubernetes_gpu_passthrough_requested | bool

- name: Determine whether GPU passthrough management tasks should run
  ansible.builtin.set_fact:
    kubernetes_gpu_passthrough_manage_enabled: >-
      {{
        (kubernetes_gpu_passthrough_requested | bool)
        and (kubernetes_gpu_passthrough_ssh_failed_hosts | default([]) | length == 0)
      }}
  delegate_to: localhost
  run_once: true
  when: kubernetes_gpu_passthrough_requested | bool

- name: Report skipped GPU passthrough management when Proxmox SSH is unavailable
  ansible.builtin.debug:
    msg: >-
      Skipping GPU passthrough management because SSH access failed for:
      {{ kubernetes_gpu_passthrough_ssh_failed_hosts | join(', ') }}.
      Configure key-based SSH access for {{ (kubernetes_proxmox_gpu | default({})).host_user | default('root') }}
      before running GPU passthrough automation.
  delegate_to: localhost
  run_once: true
  when:
    - kubernetes_gpu_passthrough_requested | bool
    - not (kubernetes_gpu_passthrough_manage_enabled | default(false) | bool)

- name: Configure GPU passthrough mappings on GPU worker VMs
  ansible.builtin.shell: |
    set -euo pipefail

    vmid="{{ item.vmid }}"
    vm_name="{{ item.name }}"

    current_config="$(ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      "/usr/sbin/qm config ${vmid}" 2>/dev/null || true)"

    needs_update="false"

    if ! printf '%s\n' "${current_config}" | grep -Fxq "machine: q35"; then
      needs_update="true"
    fi

    {% for device in item.gpu_passthrough_devices %}
    if ! printf '%s\n' "${current_config}" | grep -Fxq "hostpci{{ loop.index0 }}: mapping={{ device }},pcie=1"; then
      needs_update="true"
    fi
    {% endfor %}

    if [ "${needs_update}" = "true" ]; then
      ssh \
        -o ConnectTimeout=5 \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
        '/usr/sbin/qm set "{{ item.vmid }}" --machine q35{% for device in item.gpu_passthrough_devices %} --hostpci{{ loop.index0 }} "mapping={{ device }},pcie=1"{% endfor %}'

      echo "GPU_PASSTHROUGH_CHANGED ${vm_name} ${vmid}"
    else
      echo "GPU_PASSTHROUGH_UNCHANGED ${vm_name} ${vmid}"
    fi
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_nodes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: "'GPU_PASSTHROUGH_CHANGED' in kubernetes_gpu_passthrough_config.stdout"
  register: kubernetes_gpu_passthrough_config
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - not kubernetes_operation.plan_only | bool
    - not kubernetes_operation.destroy | bool

- name: Build list of GPU worker VMs requiring restart
  ansible.builtin.set_fact:
    kubernetes_gpu_passthrough_restart_nodes: >-
      {{
        kubernetes_gpu_passthrough_config.results
        | default([])
        | selectattr('changed', 'equalto', true)
        | map(attribute='item')
        | list
      }}
  delegate_to: localhost
  run_once: true
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_config is defined

- name: Read GPU worker VM power state after passthrough update
  ansible.builtin.shell: |
    set -euo pipefail

    ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      "/usr/sbin/qm status {{ item.vmid }}"
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_restart_nodes | default([]) }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  register: kubernetes_gpu_vm_status
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_restart_nodes | default([]) | length > 0

- name: Build list of running GPU worker VMs requiring restart
  ansible.builtin.set_fact:
    kubernetes_gpu_passthrough_running_restart_nodes: >-
      {{
        kubernetes_gpu_vm_status.results
        | default([])
        | selectattr('stdout', 'search', 'status: running')
        | map(attribute='item')
        | list
      }}
  delegate_to: localhost
  run_once: true
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_vm_status is defined

- name: Gracefully stop running GPU worker VMs after passthrough update
  ansible.builtin.shell: |
    set -euo pipefail

    ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      'timeout 90 /usr/sbin/qm shutdown "{{ item.vmid }}" --timeout 60 || /usr/sbin/qm stop "{{ item.vmid }}"'
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_running_restart_nodes | default([]) }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: true
  failed_when: false
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_running_restart_nodes | default([]) | length > 0

- name: Wait for GPU worker VMs to stop after passthrough update
  ansible.builtin.shell: |
    set -euo pipefail

    ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      "/usr/sbin/qm status {{ item.vmid }}"
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_running_restart_nodes | default([]) }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  register: kubernetes_gpu_vm_stopped
  retries: 30
  delay: 5
  until: "'status: stopped' in kubernetes_gpu_vm_stopped.stdout"
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_running_restart_nodes | default([]) | length > 0

- name: Start GPU worker VMs after passthrough update
  ansible.builtin.shell: |
    set -euo pipefail

    ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      "/usr/sbin/qm start {{ item.vmid }}"
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_running_restart_nodes | default([]) }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: true
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_running_restart_nodes | default([]) | length > 0

- name: Wait for GPU worker VMs to start after passthrough update
  ansible.builtin.shell: |
    set -euo pipefail

    ssh \
      -o ConnectTimeout=5 \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      "{{ ((kubernetes_proxmox_gpu | default({})).host_user | default('root')) }}@{{ kubernetes_proxmox.node_ssh_hosts[item.target_node] | default(item.target_node) }}" \
      "/usr/sbin/qm status {{ item.vmid }}"
  args:
    executable: /bin/bash
  loop: "{{ kubernetes_gpu_passthrough_running_restart_nodes | default([]) }}"
  loop_control:
    label: "{{ item.name }}@{{ item.target_node }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  register: kubernetes_gpu_vm_started
  retries: 30
  delay: 5
  until: "'status: running' in kubernetes_gpu_vm_started.stdout"
  when:
    - kubernetes_gpu_passthrough_manage_enabled | default(false) | bool
    - kubernetes_gpu_passthrough_running_restart_nodes | default([]) | length > 0