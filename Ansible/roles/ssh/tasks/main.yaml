---
# =============================================================================
# SSH Role - Main Task Orchestration
# -----------------------------------------------------------------------------
# Purpose:
#   Orchestrates SSH CA generation, user key generation, user certificate
#   signing, user SSH configuration, OpenSSH daemon hardening, and Proxmox
#   host-certificate workflows.
#
# Design:
#   - Keep orchestration simple.
#   - Let each task file own its own validation, idempotency, symlink safety,
#     force-regeneration behavior, and verification.
#   - Avoid running both generic and Proxmox-specific sshd configuration unless
#     explicitly requested.
#
# Phase order:
#   1. Normalize role flags
#   2. Validate inputs
#   3. Generate controller-side CA/user key material
#   4. Sign user certificates
#   5. Resolve remote user homes
#   6. Configure user-level SSH files
#   7. Configure system sshd
#   8. Run Proxmox-specific CA/host-certificate/root workflows
#   9. Repair controller output permissions
# =============================================================================

# -----------------------------------------------------------------------------
# Phase 0 - Normalize role controls
# -----------------------------------------------------------------------------

- name: SSH | Main | Normalize role controls
  ansible.builtin.set_fact:
    ssh_main_ca_enabled: "{{ ssh_ca_enabled | default(true) | bool }}"
    ssh_main_manage_ca: "{{ ssh_role_manage_ca | default(true) | bool }}"
    ssh_main_manage_controller_materials: "{{ ssh_role_manage_controller_materials | default(true) | bool }}"
    ssh_main_manage_user_materials: "{{ ssh_role_manage_user_materials | default(true) | bool }}"
    ssh_main_manage_user_authorized_keys: "{{ ssh_role_manage_user_authorized_keys |
      default(ssh_role_manage_user_materials | default(true)) | bool }}"
    ssh_main_manage_user_principals: "{{ ssh_role_manage_user_principals | default(true) | bool }}"
    ssh_main_manage_user_client_config: "{{ ssh_role_manage_user_client_config | default(true) | bool }}"
    ssh_main_manage_user_known_hosts: "{{ ssh_role_manage_user_known_hosts | default(true) | bool }}"
    ssh_main_manage_daemon: "{{ ssh_role_manage_daemon | default(true) | bool }}"
    ssh_main_manage_proxmox: "{{ ssh_role_manage_proxmox | default(true) | bool }}"
    ssh_main_use_proxmox_specialized_daemon_config: "{{ ssh_use_proxmox_specialized_daemon_config | default(true) | bool }}"
    ssh_main_manage_proxmox_ca: "{{ ssh_role_manage_proxmox_ca | default(true) | bool }}"
    ssh_main_manage_proxmox_host_certificates: "{{
      ssh_role_manage_proxmox_host_certificates |
      default(ssh_host_certificates_enabled | default(true)) | bool }}"
    ssh_main_manage_proxmox_known_hosts: "{{ ssh_role_manage_proxmox_known_hosts | default(true) | bool }}"
    ssh_main_manage_proxmox_authorized_keys: "{{ ssh_role_manage_proxmox_authorized_keys | default(true) | bool }}"
    ssh_main_manage_proxmox_principals: "{{ ssh_role_manage_proxmox_principals | default(true) | bool }}"
    ssh_main_fix_output_permissions: "{{ ssh_role_fix_output_permissions | default(true) | bool }}"
    ssh_main_flush_handlers: "{{ ssh_role_flush_handlers | default(false) | bool }}"
    ssh_main_is_proxmox: "{{ 'proxmox' in group_names }}"
    ssh_main_users_count: "{{ ssh_role_users | default([]) | length }}"
  changed_when: false
  tags:
    - ssh
    - ssh-main

- name: SSH | Main | Show selected orchestration mode
  ansible.builtin.debug:
    msg:
      - "SSH role orchestration starting."
      - "Host: {{ inventory_hostname }}"
      - "Proxmox host: {{ ssh_main_is_proxmox | bool }}"
      - "CA enabled: {{ ssh_main_ca_enabled | bool }}"
      - "Controller materials: {{ ssh_main_manage_controller_materials | bool }}"
      - "User materials: {{ ssh_main_manage_user_materials | bool }}"
      - "User count: {{ ssh_main_users_count }}"
      - "Generic daemon config: {{ ssh_main_manage_daemon | bool and (not
        ssh_main_is_proxmox or not
        ssh_main_use_proxmox_specialized_daemon_config) }}"
      - "Proxmox specialized config: {{ ssh_main_is_proxmox | bool and
        ssh_main_manage_proxmox | bool and
        ssh_main_use_proxmox_specialized_daemon_config | bool }}"
  when: ssh_role_show_summary | default(true)
  tags:
    - ssh
    - ssh-main
    - ssh-summary

# -----------------------------------------------------------------------------
# Phase 1 - Validation
# -----------------------------------------------------------------------------

- name: SSH | Main | Validate SSH role inputs
  ansible.builtin.import_tasks: base/validate.yaml
  tags:
    - ssh
    - ssh-validate

# -----------------------------------------------------------------------------
# Phase 2 - Controller-side CA and user key material
# -----------------------------------------------------------------------------

- name: SSH | Main | Generate SSH Certificate Authority
  ansible.builtin.import_tasks: base/generate-ca.yaml
  when:
    - ssh_main_manage_controller_materials | bool
    - ssh_main_manage_ca | bool
    - ssh_main_ca_enabled | bool
  tags:
    - ssh
    - ssh-ca
    - ssh-ca-generate

- name: SSH | Main | Generate SSH user key material
  ansible.builtin.import_tasks: base/generate-keys.yaml
  when:
    - ssh_main_manage_controller_materials | bool
    - ssh_main_manage_user_materials | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-keys
    - ssh-keys-generate

- name: SSH | Main | Sign SSH user keys with CA
  ansible.builtin.import_tasks: base/sign.yaml
  when:
    - ssh_main_manage_controller_materials | bool
    - ssh_main_manage_user_materials | bool
    - ssh_main_ca_enabled | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-sign
    - ssh-certificates

# -----------------------------------------------------------------------------
# Phase 3 - Resolve remote user homes
# -----------------------------------------------------------------------------

- name: SSH | Main | Resolve managed user home directories
  ansible.builtin.import_tasks: base/resolve-homes.yaml
  when:
    - ssh_main_users_count | int > 0
    - >-
      ssh_main_manage_user_authorized_keys | bool or
      ssh_main_manage_user_principals | bool or
      ssh_main_manage_user_client_config | bool or
      ssh_main_manage_user_known_hosts | bool
  tags:
    - ssh
    - ssh-homes

# -----------------------------------------------------------------------------
# Phase 4 - User-level SSH deployment
# -----------------------------------------------------------------------------

- name: SSH | Main | Install authorized_keys for managed users
  ansible.builtin.import_tasks: users/copy-keys.yaml
  when:
    - ssh_main_manage_user_authorized_keys | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-authorized-keys

- name: SSH | Main | Install AuthorizedPrincipalsFile entries for managed users
  ansible.builtin.import_tasks: users/configure-principals.yaml
  when:
    - ssh_main_manage_user_principals | bool
    - ssh_main_ca_enabled | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-principals

- name: SSH | Main | Install SSH client config for managed users
  ansible.builtin.import_tasks: users/copy-config.yaml
  when:
    - ssh_main_manage_user_client_config | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-client-config

- name: SSH | Main | Install known_hosts for managed users
  ansible.builtin.import_tasks: users/copy-known-hosts.yaml
  when:
    - ssh_main_manage_user_known_hosts | bool
    - ssh_main_users_count | int > 0
  tags:
    - ssh
    - ssh-known-hosts

# -----------------------------------------------------------------------------
# Phase 5 - Generic OpenSSH daemon configuration
# -----------------------------------------------------------------------------
# Proxmox hosts normally use the specialized proxmox/configure-ssh.yaml path.
# Non-Proxmox hosts use base/configure.yaml.
# Set ssh_use_proxmox_specialized_daemon_config=false to force generic daemon
# configuration on Proxmox too.
# -----------------------------------------------------------------------------

- name: SSH | Main | Configure generic OpenSSH daemon
  ansible.builtin.import_tasks: base/configure.yaml
  when:
    - ssh_main_manage_daemon | bool
    - not (ssh_main_is_proxmox | bool and
      ssh_main_use_proxmox_specialized_daemon_config | bool)
  tags:
    - ssh
    - ssh-configure
    - ssh-server

# -----------------------------------------------------------------------------
# Phase 6 - Proxmox-specific SSH configuration
# -----------------------------------------------------------------------------

- name: SSH | Main | Run Proxmox-specific SSH workflow
  when:
    - ssh_main_is_proxmox | bool
    - ssh_main_manage_proxmox | bool
  tags:
    - ssh
    - ssh-proxmox
  block:

    - name: SSH | Main | Copy SSH CA trust material to Proxmox node
      ansible.builtin.import_tasks: proxmox/copy-ca.yaml
      when:
        - ssh_main_ca_enabled | bool
        - ssh_main_manage_proxmox_ca | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-ca
        - ssh-copy-ca

    - name: SSH | Main | Sign Proxmox SSH host keys with CA
      ansible.builtin.import_tasks: proxmox/sign-host-keys.yaml
      when:
        - ssh_main_ca_enabled | bool
        - ssh_main_manage_proxmox_host_certificates | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-host-cert

    - name: SSH | Main | Create Proxmox root known_hosts
      ansible.builtin.import_tasks: proxmox/create-known-hosts.yaml
      when:
        - ssh_main_ca_enabled | bool
        - ssh_main_manage_proxmox_known_hosts | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-known-hosts

    - name: SSH | Main | Create Proxmox root authorized_keys fallback
      ansible.builtin.import_tasks: proxmox/create-ssh-authorized-keys.yaml
      when:
        - ssh_main_manage_proxmox_authorized_keys | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-authorized-keys

    - name: SSH | Main | Ensure Proxmox certificate principals are usable
      ansible.builtin.import_tasks: proxmox/ensure-ssh-works.yaml
      when:
        - ssh_main_ca_enabled | bool
        - ssh_main_manage_proxmox_principals | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-principals
        - ssh-ensure-works

    - name: SSH | Main | Configure Proxmox OpenSSH daemon
      ansible.builtin.import_tasks: proxmox/configure-ssh.yaml
      when:
        - ssh_main_manage_daemon | bool
        - ssh_main_use_proxmox_specialized_daemon_config | bool
      tags:
        - ssh
        - ssh-proxmox
        - ssh-configure
        - ssh-server

# -----------------------------------------------------------------------------
# Phase 7 - Repair controller output permissions
# -----------------------------------------------------------------------------

- name: SSH | Main | Fix SSH output permissions on controller
  ansible.builtin.import_tasks: base/fix-permissions.yaml
  when:
    - ssh_main_fix_output_permissions | bool
    - ssh_main_manage_controller_materials | bool
  tags:
    - ssh
    - ssh-permissions

# -----------------------------------------------------------------------------
# Phase 8 - Optional final handler flush
# -----------------------------------------------------------------------------

- name: SSH | Main | Flush SSH handlers
  ansible.builtin.meta: flush_handlers
  when: ssh_main_flush_handlers | bool
  tags:
    - ssh
    - ssh-handlers

# -----------------------------------------------------------------------------
# Phase 9 - Summary
# -----------------------------------------------------------------------------

- name: SSH | Main | Show SSH role completion summary
  ansible.builtin.debug:
    msg:
      - "SSH role orchestration complete."
      - "Host: {{ inventory_hostname }}"
      - "Proxmox host: {{ ssh_main_is_proxmox | bool }}"
      - "CA enabled: {{ ssh_main_ca_enabled | bool }}"
      - "Managed users: {{ ssh_main_users_count }}"
      - "Controller materials managed: {{ ssh_main_manage_controller_materials |
        bool }}"
      - "User materials managed: {{ ssh_main_manage_user_materials | bool }}"
      - "Daemon managed: {{ ssh_main_manage_daemon | bool }}"
      - "Proxmox workflow managed: {{ ssh_main_is_proxmox | bool and
        ssh_main_manage_proxmox | bool }}"
  when: ssh_role_show_summary | default(true)
  tags:
    - ssh
    - ssh-summary
