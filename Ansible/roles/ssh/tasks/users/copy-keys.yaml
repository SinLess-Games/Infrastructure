---
# =============================================================================
# SSH Role - Install User SSH Keys
# -----------------------------------------------------------------------------
# Purpose:
#   Installs authorized_keys for managed users and optionally installs
#   controller-generated SSH identity material into each user's ~/.ssh directory.
#
# Security model:
#   - CA-backed SSH authentication is preferred.
#   - authorized_keys is retained as a bootstrap/recovery fallback.
#   - Private identity installation is disabled by default and must be enabled
#     explicitly with ssh_install_identity_keys=true.
#
# Inputs:
#   - ssh_role_users
#   - ssh_output_base or ssh_user_materials_output_dir
#   - ssh_key_type
#   - ssh_ca_enabled
#
# Supports:
#   - user.shared_certs
#   - user["shared-certs"] legacy compatibility
#   - ssh.authorized_keys
#   - controller-generated public keys
#   - optional controller-generated certificates
#   - optional controller-generated private identity keys
#
# Source template preference:
#   1. {{ role_path }}/templates/authorized_keys.j2
#   2. {{ role_path }}/templates/ssh_authorized_keys.j2
#   3. {{ playbook_dir }}/../templates/ssh/authorized_keys.j2
# =============================================================================

# -----------------------------------------------------------------------------
# Normalize inputs
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Normalize inputs
  ansible.builtin.set_fact:
    ssh_copy_keys_users_effective: "{{ ssh_role_users | default(users | default([])) }}"
    ssh_copy_keys_output_base_effective: >-
      {{
        ssh_user_materials_output_dir
        | default(ssh_output_base | default(playbook_dir ~ '/../../.outputs/ssh/users'))
      }}
    ssh_copy_keys_key_type_effective: "{{ ssh_key_type | default('ed25519') }}"
    ssh_copy_keys_ca_enabled_effective: "{{ ssh_ca_enabled | default(false) | bool }}"
    ssh_copy_keys_install_identity_keys_effective: "{{ ssh_install_identity_keys | default(false) | bool }}"
    ssh_copy_keys_identity_force_effective: "{{ ssh_identity_force | default(false) | bool }}"
    ssh_copy_keys_include_certificates_effective: "{{ ssh_authorized_keys_include_certificates | default(false) | bool }}"
    ssh_copy_keys_home_map_effective: "{{ ssh__user_homes | default({}) }}"
    ssh_copy_keys_authorized_keys_map_effective: >-
      {{
        ssh_authorized_keys
        | default(ssh.authorized_keys | default({}) if ssh is defined else {})
      }}
    ssh_copy_keys_skip_noninteractive_effective: "{{ ssh_copy_keys_skip_noninteractive_users | default(true) | bool }}"
    ssh_copy_keys_noninteractive_shells_effective:
      - /usr/sbin/nologin
      - /sbin/nologin
      - /bin/false
      - /usr/bin/false
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

# -----------------------------------------------------------------------------
# Validate inputs
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Validate inputs
  ansible.builtin.assert:
    that:
      - ssh_copy_keys_users_effective is sequence
      - ssh_copy_keys_users_effective is not string
      - ssh_copy_keys_users_effective is not mapping
      - ssh_copy_keys_output_base_effective is string
      - ssh_copy_keys_output_base_effective is match('^/')
      - ssh_copy_keys_output_base_effective | length > 1
      - ssh_copy_keys_output_base_effective not in ['/', '/etc', '/usr', '/var',
        '/tmp', '/root', '/home']
      - ssh_copy_keys_key_type_effective in ssh_supported_key_types |
        default(['ed25519', 'rsa', 'ecdsa'])
      - ssh_copy_keys_home_map_effective is mapping
      - ssh_copy_keys_authorized_keys_map_effective is mapping
    fail_msg: "SSH key installation inputs are invalid."
    success_msg: "SSH key installation inputs are valid."
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-validate

- name: SSH | Keys Install | Validate user entries
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
    fail_msg: "Each SSH user entry must be a mapping with a valid Linux username."
  loop: "{{ ssh_copy_keys_users_effective }}"
  loop_control:
    label: "{{ item.name | default('undefined-user') if item is mapping else
      'invalid-entry' }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-validate

# -----------------------------------------------------------------------------
# Build candidate users
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Build candidate user list
  ansible.builtin.set_fact:
    ssh_copy_keys_candidate_users: >-
      {%- set users_out = [] -%} {%- for user in ssh_copy_keys_users_effective
      -%}
        {%- set state = user['state'] | default('present') -%}
        {%- set manage_ssh = user['manage_ssh'] | default(users_default_manage_ssh | default(true)) -%}
        {%- set shell = user['shell'] | default('') -%}
        {%- set is_noninteractive = shell in ssh_copy_keys_noninteractive_shells_effective -%}
        {%- if state == 'present' and manage_ssh | bool -%}
          {%- if not (ssh_copy_keys_skip_noninteractive_effective | bool and is_noninteractive) -%}
            {%- set _ = users_out.append(user) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%} {{ users_out }}
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

# -----------------------------------------------------------------------------
# Resolve missing home directories
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Resolve missing user homes with getent
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item.name }}"
  loop: "{{ ssh_copy_keys_candidate_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_copy_keys_getent_passwd
  changed_when: false
  failed_when: false
  when: item.name not in ssh_copy_keys_home_map_effective
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Add resolved homes to home map
  ansible.builtin.set_fact:
    ssh_copy_keys_home_map_effective: >-
      {{
        ssh_copy_keys_home_map_effective
        | combine({ item.item.name: item.stdout.split(':')[5] })
      }}
  loop: "{{ ssh_copy_keys_getent_passwd.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - item is defined
    - item.skipped is not defined or not item.skipped
    - item.rc | default(1) == 0
    - item.stdout is defined
    - item.stdout.split(':') | length >= 7
    - item.stdout.split(':')[5] is match('^/')
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

# -----------------------------------------------------------------------------
# Build install jobs
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Build key installation jobs
  ansible.builtin.set_fact:
    ssh_copy_keys_jobs: >-
      {%- set jobs = [] -%} {%- for user in ssh_copy_keys_candidate_users |
      default([]) -%}
        {%- set username = user['name'] -%}
        {%- set home = ssh_copy_keys_home_map_effective[username] | default(user['home_directory'] | default('')) -%}
        {%- if home | length > 0 -%}
          {%- set key_dir = ssh_copy_keys_output_base_effective ~ '/' ~ username -%}
          {%- set key_name = 'id_' ~ ssh_copy_keys_key_type_effective -%}

          {%- if 'shared_certs' in user -%}
            {%- set shared_certs = user['shared_certs'] | default([]) -%}
          {%- elif 'shared-certs' in user -%}
            {%- set shared_certs = user['shared-certs'] | default([]) -%}
          {%- else -%}
            {%- set shared_certs = [] -%}
          {%- endif -%}

          {%- if username in ssh_copy_keys_authorized_keys_map_effective -%}
            {%- set auth_config = ssh_copy_keys_authorized_keys_map_effective[username] -%}
          {%- else -%}
            {%- set auth_config = {} -%}
          {%- endif -%}

          {# IMPORTANT:
             Do not use auth_config.keys.
             "keys" is a dictionary method in Jinja/Python and will resolve to
             <built-in method keys ...> instead of the configured field.
             Always use bracket access for a data field named "keys".
          #}
          {%- if auth_config is mapping and 'keys' in auth_config -%}
            {%- set raw_keys = auth_config['keys'] | default([]) -%}
          {%- else -%}
            {%- set raw_keys = [] -%}
          {%- endif -%}

          {%- if auth_config is mapping and 'enabled' in auth_config -%}
            {%- set authorized_enabled = auth_config['enabled'] | default(ssh_authorized_keys_fallback_enabled | default(true)) -%}
          {%- else -%}
            {%- set authorized_enabled = ssh_authorized_keys_fallback_enabled | default(true) -%}
          {%- endif -%}

          {%- if auth_config is mapping and 'exclusive' in auth_config -%}
            {%- set exclusive = auth_config['exclusive'] | default(ssh_authorized_keys_default_exclusive | default(false)) -%}
          {%- else -%}
            {%- set exclusive = ssh_authorized_keys_default_exclusive | default(false) -%}
          {%- endif -%}

          {%- set _ = jobs.append({
            'name': username,
            'group': user['primary_group'] | default(username),
            'home': home,
            'ssh_dir': home ~ '/.ssh',
            'authorized_keys_path': home ~ '/.ssh/authorized_keys',
            'controller_key_dir': key_dir,
            'controller_private_key_path': key_dir ~ '/' ~ key_name,
            'controller_public_key_path': key_dir ~ '/' ~ key_name ~ '.pub',
            'controller_certificate_path': key_dir ~ '/' ~ key_name ~ '-cert.pub',
            'remote_private_key_path': home ~ '/.ssh/' ~ key_name,
            'remote_public_key_path': home ~ '/.ssh/' ~ key_name ~ '.pub',
            'remote_certificate_path': home ~ '/.ssh/' ~ key_name ~ '-cert.pub',
            'shared_users': shared_certs,
            'raw_authorized_keys': raw_keys,
            'authorized_keys_enabled': authorized_enabled,
            'authorized_keys_exclusive': exclusive
          }) -%}
        {%- endif -%}
      {%- endfor -%} {{ jobs }}
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Validate key installation jobs
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.group is string
      - item.group | length > 0
      - item.home is match('^/')
      - item.ssh_dir is match('^/')
      - item.authorized_keys_path is match('^/')
      - item.controller_key_dir is match('^/')
      - item.controller_private_key_path is match('^/')
      - item.controller_public_key_path is match('^/')
      - item.controller_certificate_path is match('^/')
      - item.remote_private_key_path.startswith(item.ssh_dir ~ '/')
      - item.remote_public_key_path.startswith(item.ssh_dir ~ '/')
      - item.remote_certificate_path.startswith(item.ssh_dir ~ '/')
      - item.shared_users is sequence
      - item.shared_users is not string
      - item.shared_users is not mapping
      - item.raw_authorized_keys is sequence
      - item.raw_authorized_keys is not string
      - item.raw_authorized_keys is not mapping
    fail_msg: "Invalid SSH key installation job: {{ item }}"
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-validate

# -----------------------------------------------------------------------------
# Resolve template source
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Check role-local authorized_keys.j2 template
  ansible.builtin.stat:
    path: "{{ role_path }}/templates/authorized_keys.j2"
  delegate_to: localhost
  register: ssh_copy_keys_role_template_stat
  changed_when: false
  become: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Check role-local ssh_authorized_keys.j2 template
  ansible.builtin.stat:
    path: "{{ role_path }}/templates/ssh_authorized_keys.j2"
  delegate_to: localhost
  register: ssh_copy_keys_role_alt_template_stat
  changed_when: false
  become: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Check legacy authorized_keys.j2 template
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../templates/ssh/authorized_keys.j2"
  delegate_to: localhost
  register: ssh_copy_keys_legacy_template_stat
  changed_when: false
  become: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Select authorized_keys template source
  ansible.builtin.set_fact:
    ssh_copy_keys_authorized_keys_template_src_effective: >-
      {{
        ssh_authorized_keys_template_src
        | default(
            (role_path ~ '/templates/authorized_keys.j2')
            if ssh_copy_keys_role_template_stat.stat.exists | default(false)
            else (
              (role_path ~ '/templates/ssh_authorized_keys.j2')
              if ssh_copy_keys_role_alt_template_stat.stat.exists | default(false)
              else (playbook_dir ~ '/../templates/ssh/authorized_keys.j2')
            )
          )
      }}
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Assert authorized_keys template exists
  ansible.builtin.assert:
    that:
      - >-
        ssh_authorized_keys_template_src is defined or
        ssh_copy_keys_role_template_stat.stat.exists | default(false) or
        ssh_copy_keys_role_alt_template_stat.stat.exists | default(false) or
        ssh_copy_keys_legacy_template_stat.stat.exists | default(false)
    fail_msg: >-
      No authorized_keys template was found. Expected one of: - {{ role_path
      }}/templates/authorized_keys.j2 - {{ role_path
      }}/templates/ssh_authorized_keys.j2 - {{ playbook_dir
      }}/../templates/ssh/authorized_keys.j2 Or set
      ssh_authorized_keys_template_src to a valid template path.
    success_msg: "authorized_keys template source is available."
  delegate_to: localhost
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-validate

# -----------------------------------------------------------------------------
# Controller-side material inspection
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Stat controller public keys
  ansible.builtin.stat:
    path: "{{ item.controller_public_key_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }} public"
  delegate_to: localhost
  register: ssh_copy_keys_public_key_stats
  changed_when: false
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

- name: SSH | Keys Install | Assert controller public keys exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
    fail_msg: >-
      Missing, invalid, or symlinked public key on controller for {{
      item.item.name }}: {{ item.item.controller_public_key_path }}. Run
      generate-keys.yaml first.
  loop: "{{ ssh_copy_keys_public_key_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  delegate_to: localhost
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

- name: SSH | Keys Install | Stat controller certificates
  ansible.builtin.stat:
    path: "{{ item.controller_certificate_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }} certificate"
  delegate_to: localhost
  register: ssh_copy_keys_certificate_stats
  changed_when: false
  become: false
  when: ssh_copy_keys_ca_enabled_effective | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

- name: SSH | Keys Install | Refuse symlinked controller certificates
  ansible.builtin.fail:
    msg: >-
      Controller certificate for {{ item.item.name }} is a symlink: {{
      item.item.controller_certificate_path }}. Refusing to use symlinked
      certificate material.
  loop: "{{ ssh_copy_keys_certificate_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ssh_copy_keys_ca_enabled_effective | bool
    - item.stat.islnk | default(false) | bool
  delegate_to: localhost
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

# -----------------------------------------------------------------------------
# Build authorized_keys material
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Build authorized_keys render jobs
  ansible.builtin.set_fact:
    ssh_copy_keys_authorized_keys_jobs: >-
      {%- set jobs = [] -%} {%- for job in ssh_copy_keys_jobs | default([]) -%}
        {%- set key_paths = [] -%}
        {%- set _ = key_paths.append(job.controller_public_key_path) -%}

        {%- if ssh_copy_keys_include_certificates_effective | bool and ssh_copy_keys_ca_enabled_effective | bool -%}
          {%- set _ = key_paths.append(job.controller_certificate_path) -%}
        {%- endif -%}

        {%- for shared_user in job.shared_users -%}
          {%- set _ = key_paths.append(ssh_copy_keys_output_base_effective ~ '/' ~ shared_user ~ '/id_' ~ ssh_copy_keys_key_type_effective ~ '.pub') -%}
        {%- endfor -%}

        {%- set _ = jobs.append(job | combine({
          'authorized_key_paths': key_paths | unique | sort | list,
          'authorized_key_literals': job.raw_authorized_keys | unique | sort | list
        }, recursive=True)) -%}
      {%- endfor -%} {{ jobs }}
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Build required authorized key path list
  ansible.builtin.set_fact:
    ssh_copy_keys_required_authorized_key_paths: >-
      {{
        ssh_copy_keys_authorized_keys_jobs
        | default([])
        | map(attribute='authorized_key_paths')
        | list
        | flatten
        | unique
        | sort
      }}
  changed_when: false
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Stat authorized key source paths on controller
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ ssh_copy_keys_required_authorized_key_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  register: ssh_copy_keys_authorized_key_source_stats
  changed_when: false
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

- name: SSH | Keys Install | Assert authorized key source paths exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
    fail_msg: >-
      Required authorized_keys source file is missing, invalid, or symlinked: {{
      item.item }}
    success_msg: "Authorized key source exists: {{ item.item }}"
  loop: "{{ ssh_copy_keys_authorized_key_source_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-controller

# -----------------------------------------------------------------------------
# Remote ~/.ssh directories
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Ensure user .ssh directories exist
  ansible.builtin.file:
    path: "{{ item.ssh_dir }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "{{ ssh_authorized_keys_owner_mode | default('0700') }}"
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  tags:
    - ssh
    - ssh-copy-keys

# -----------------------------------------------------------------------------
# Remote symlink safety checks
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Stat remote authorized_keys paths
  ansible.builtin.stat:
    path: "{{ item.authorized_keys_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_authorized_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_copy_keys_remote_authorized_keys_stats
  changed_when: false
  become: true
  tags:
    - ssh
    - ssh-copy-keys

- name: SSH | Keys Install | Refuse symlinked remote authorized_keys
  ansible.builtin.fail:
    msg: >-
      Remote authorized_keys for {{ item.item.name }} is a symlink: {{
      item.item.authorized_keys_path }}. Refusing to overwrite symlinked
      authorized_keys.
  loop: "{{ ssh_copy_keys_remote_authorized_keys_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.islnk | default(false) | bool
  tags:
    - ssh
    - ssh-copy-keys

# -----------------------------------------------------------------------------
# Render authorized_keys
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Render authorized_keys for users
  ansible.builtin.template:
    src: "{{ ssh_copy_keys_authorized_keys_template_src_effective }}"
    dest: "{{ item.authorized_keys_path }}"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "{{ ssh_authorized_keys_file_mode | default('0600') }}"
    backup: "{{ ssh_authorized_keys_backup | default(false) }}"
  loop: "{{ ssh_copy_keys_authorized_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: item.authorized_keys_enabled | bool
  vars:
    ansible_template_src: "{{ ssh_copy_keys_authorized_keys_template_src_effective }}"
    authorized_key_paths: "{{ item.authorized_key_paths }}"
    authorized_key_literals: "{{ item.authorized_key_literals }}"
    authorized_keys_exclusive: "{{ item.authorized_keys_exclusive }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-authorized-keys

- name: SSH | Keys Install | Remove authorized_keys when fallback is disabled
  ansible.builtin.file:
    path: "{{ item.authorized_keys_path }}"
    state: absent
  loop: "{{ ssh_copy_keys_authorized_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when:
    - not (item.authorized_keys_enabled | bool)
    - ssh_remove_disabled_authorized_keys | default(false) | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-authorized-keys

# -----------------------------------------------------------------------------
# Optional identity key installation
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Stat controller private keys
  ansible.builtin.stat:
    path: "{{ item.controller_private_key_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }} private"
  delegate_to: localhost
  register: ssh_copy_keys_private_key_stats
  changed_when: false
  become: false
  when: ssh_copy_keys_install_identity_keys_effective | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Assert controller private keys exist when identity
    install is enabled
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
    fail_msg: >-
      Missing, invalid, or symlinked private key on controller for {{
      item.item.name }}: {{ item.item.controller_private_key_path }}. Run
      generate-keys.yaml first or disable ssh_install_identity_keys.
  loop: "{{ ssh_copy_keys_private_key_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  delegate_to: localhost
  become: false
  when: ssh_copy_keys_install_identity_keys_effective | bool
  no_log: "{{ ssh_role_no_log | default(true) }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Stat remote identity paths
  ansible.builtin.stat:
    path: "{{ item.remote_private_key_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }} remote private"
  register: ssh_copy_keys_remote_private_key_stats
  changed_when: false
  become: true
  when: ssh_copy_keys_install_identity_keys_effective | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Refuse symlinked remote private keys
  ansible.builtin.fail:
    msg: >-
      Remote private key for {{ item.item.name }} is a symlink: {{
      item.item.remote_private_key_path }}. Refusing to overwrite symlinked
      identity material.
  loop: "{{ ssh_copy_keys_remote_private_key_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ssh_copy_keys_install_identity_keys_effective | bool
    - item.stat.islnk | default(false) | bool
  no_log: "{{ ssh_role_no_log | default(true) }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Copy private identity keys to user homes
  ansible.builtin.copy:
    src: "{{ item.controller_private_key_path }}"
    dest: "{{ item.remote_private_key_path }}"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "{{ ssh_key_mode_private | default('0600') }}"
    force: "{{ ssh_copy_keys_identity_force_effective }}"
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: ssh_copy_keys_install_identity_keys_effective | bool
  no_log: "{{ ssh_role_no_log | default(true) }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Copy public identity keys to user homes
  ansible.builtin.copy:
    src: "{{ item.controller_public_key_path }}"
    dest: "{{ item.remote_public_key_path }}"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "{{ ssh_key_mode_public | default('0644') }}"
    force: "{{ ssh_copy_keys_identity_force_effective }}"
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: ssh_copy_keys_install_identity_keys_effective | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

- name: SSH | Keys Install | Copy user certificates to user homes
  ansible.builtin.copy:
    src: "{{ item.controller_certificate_path }}"
    dest: "{{ item.remote_certificate_path }}"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "{{ ssh_key_mode_certificate | default(ssh_key_mode_public |
      default('0644')) }}"
    force: "{{ ssh_copy_keys_identity_force_effective }}"
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when:
    - ssh_copy_keys_install_identity_keys_effective | bool
    - ssh_copy_keys_ca_enabled_effective | bool
    - >-
      (
        ssh_copy_keys_certificate_stats.results
        | default([])
        | selectattr('item.name', 'equalto', item.name)
        | map(attribute='stat.exists')
        | list
        | first
        | default(false)
      ) | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities

# -----------------------------------------------------------------------------
# Verify remote files
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Stat rendered authorized_keys files
  ansible.builtin.stat:
    path: "{{ item.authorized_keys_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_authorized_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_copy_keys_rendered_authorized_keys_stats
  changed_when: false
  become: true
  when: item.authorized_keys_enabled | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-verify

- name: SSH | Keys Install | Assert rendered authorized_keys files are valid
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
      - item.stat.pw_name == item.item.name
      - item.stat.mode == (ssh_authorized_keys_file_mode | default('0600'))
    fail_msg: >-
      authorized_keys is missing, symlinked, or has incorrect ownership/mode for
      {{ item.item.name }}.
    success_msg: "authorized_keys is valid for {{ item.item.name }}."
  loop: "{{ ssh_copy_keys_rendered_authorized_keys_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item is defined
    - item.skipped is not defined or not item.skipped
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-copy-keys-verify

- name: SSH | Keys Install | Stat installed identity files
  ansible.builtin.stat:
    path: "{{ item.remote_private_key_path }}"
    follow: false
  loop: "{{ ssh_copy_keys_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_copy_keys_installed_identity_stats
  changed_when: false
  become: true
  when: ssh_copy_keys_install_identity_keys_effective | bool
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities
    - ssh-copy-keys-verify

- name: SSH | Keys Install | Assert installed identity files are valid
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
      - item.stat.pw_name == item.item.name
      - item.stat.mode == (ssh_key_mode_private | default('0600'))
    fail_msg: >-
      Installed SSH private identity is missing, symlinked, or has incorrect
      ownership/mode for {{ item.item.name }}.
    success_msg: "Installed SSH private identity is valid for {{ item.item.name }}."
  loop: "{{ ssh_copy_keys_installed_identity_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ssh_copy_keys_install_identity_keys_effective | bool
    - item is defined
    - item.skipped is not defined or not item.skipped
  no_log: "{{ ssh_role_no_log | default(true) }}"
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-identities
    - ssh-copy-keys-verify

# -----------------------------------------------------------------------------
# Summary
# -----------------------------------------------------------------------------

- name: SSH | Keys Install | Show key installation summary
  ansible.builtin.debug:
    msg:
      - "SSH key installation complete."
      - "Output base: {{ ssh_copy_keys_output_base_effective }}"
      - "Key type: {{ ssh_copy_keys_key_type_effective }}"
      - "CA enabled: {{ ssh_copy_keys_ca_enabled_effective }}"
      - "authorized_keys includes certificates: {{
        ssh_copy_keys_include_certificates_effective }}"
      - "Identity key installation enabled: {{
        ssh_copy_keys_install_identity_keys_effective }}"
      - >-
        Users processed: {{
          ssh_copy_keys_jobs
          | default([])
          | map(attribute='name')
          | list
          | join(', ')
          if ssh_copy_keys_jobs | default([]) | length > 0
          else 'none'
        }}
  when: ssh_role_show_summary | default(true)
  tags:
    - ssh
    - ssh-copy-keys
    - ssh-summary
