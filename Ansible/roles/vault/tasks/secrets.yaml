---
- name: Ensure Vault bootstrap data exists locally for secrets updates
  ansible.builtin.stat:
    path: "{{ vault_unseal_keys_output_dir }}/{{ vault_unseal_keys_file }}"
  register: vault_bootstrap_file
  delegate_to: localhost
  become: false
  run_once: true
  tags:
    - vault
    - secrets

- name: Assert Vault bootstrap data is available for secrets updates
  ansible.builtin.assert:
    that:
      - vault_bootstrap_file.stat.exists
    fail_msg: >-
      Vault bootstrap data file {{ vault_unseal_keys_output_dir }}/{{ vault_unseal_keys_file }}
      is required before running the secrets-only phase.
  run_once: true
  tags:
    - vault
    - secrets

- name: Load Vault bootstrap data from localhost for secrets updates
  ansible.builtin.slurp:
    src: "{{ vault_unseal_keys_output_dir }}/{{ vault_unseal_keys_file }}"
  register: vault_bootstrap_file_content
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  tags:
    - vault
    - secrets

- name: Cache Vault bootstrap data on localhost for secrets updates
  ansible.builtin.set_fact:
    vault_bootstrap_data: "{{ vault_bootstrap_file_content.content | b64decode | from_json }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  no_log: true
  tags:
    - vault
    - secrets

- name: Ensure local Vault CA certificate exists for secrets updates
  ansible.builtin.stat:
    path: "{{ vault_tls_local_dir }}/ca.crt"
  register: vault_local_ca_file
  delegate_to: localhost
  become: false
  run_once: true
  tags:
    - vault
    - secrets

- name: Assert local Vault CA certificate exists
  ansible.builtin.assert:
    that:
      - vault_local_ca_file.stat.exists
    fail_msg: >-
      Local Vault CA certificate {{ vault_tls_local_dir }}/ca.crt is missing.
      Run the full Vault configure phase first so the secrets-only phase can validate TLS.
  run_once: true
  tags:
    - vault
    - secrets

- name: Refresh primary Vault status for secrets updates
  ansible.builtin.command:
    cmd: "{{ vault_bin_path }} status -format=json"
  register: vault_primary_status_cmd
  failed_when: false
  changed_when: false
  environment:
    VAULT_ADDR: "{{ vault_local_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert_file }}"
  delegate_to: "{{ vault_primary_host }}"
  run_once: true
  tags:
    - vault
    - secrets

- name: Parse primary Vault status for secrets updates
  ansible.builtin.set_fact:
    vault_primary_status_json: >-
      {{
        (vault_primary_status_cmd.stdout | default('{}')) | from_json
        if (vault_primary_status_cmd.stdout | default('') | length > 0)
        else {}
      }}
  run_once: true
  tags:
    - vault
    - secrets

- name: Unseal primary Vault node when needed for secrets updates
  ansible.builtin.shell: |
    set -euo pipefail
    for key in {{ hostvars['localhost'].vault_bootstrap_data.unseal_keys_b64[:vault_key_threshold | int] | map('quote') | join(' ') }}; do
      attempt=1
      while true; do
        if {{ vault_bin_path }} operator unseal "$key" >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -ge 3 ]; then
          {{ vault_bin_path }} operator unseal "$key"
          exit 1
        fi
        attempt=$((attempt + 1))
        sleep 2
      done
      sleep 1
    done
  args:
    executable: /bin/bash
  environment:
    VAULT_ADDR: "{{ vault_local_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert_file }}"
  no_log: true
  changed_when: true
  delegate_to: "{{ vault_primary_host }}"
  run_once: true
  when:
    - vault_primary_status_json.sealed | default(true)
  tags:
    - vault
    - secrets

- name: Wait for primary Vault node to become active for secrets updates
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_local_dir }}/ca.crt"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 503
    return_content: true
  register: vault_primary_health
  delegate_to: localhost
  become: false
  run_once: true
  until: vault_primary_health.json.sealed | default(true) == false
  retries: "{{ vault_cluster_join_retries }}"
  delay: "{{ vault_cluster_join_delay }}"
  tags:
    - vault
    - secrets

- name: Write configured KV secrets
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_addr }}/v1/secrets/data/{{ item.key }}"
    method: POST
    headers:
      X-Vault-Token: "{{ hostvars['localhost'].vault_bootstrap_data.root_token }}"
      Content-Type: "application/json"
    ca_path: "{{ vault_tls_local_dir }}/ca.crt"
    body_format: raw
    body: "{{ {'data': item.value.data | default({})} | to_json }}"
    status_code:
      - 200
      - 204
  loop: "{{ secrets | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: (vault_kv_mounts | default({}))['secrets'] is defined
  no_log: true
  tags:
    - vault
    - secrets
