---
# =============================================================================
# shell-config — install
# -----------------------------------------------------------------------------
# Installs shell tooling and prepares per-user shell framework directories.
#
# Installs:
#   - zsh system package
#   - Oh My Zsh per interactive user
#
# Removes by default:
#   - starship package/binaries/configs
#
# Safety:
#   - Skips users without valid homes.
#   - Skips non-zsh users for Oh My Zsh.
#   - Refuses symlinked Oh My Zsh paths.
#   - Runs user-owned git clones as the target user.
# =============================================================================

# -----------------------------------------------------------------------------
# Normalize install controls
# -----------------------------------------------------------------------------

- name: Shell Config | Install | Normalize install controls
  ansible.builtin.set_fact:
    shell__install_users: "{{ shell__home_users | default(shell__resolved_users | default([])) }}"
    shell__install_zsh_enabled: "{{ shell_install_zsh | default(true) | bool }}"
    shell__install_oh_my_zsh_enabled: "{{ shell_install_oh_my_zsh | default(true) | bool }}"
    shell__install_starship_enabled: "{{ shell_install_starship | default(false) | bool }}"
    shell__remove_starship_enabled: "{{ shell_remove_starship | default(true) | bool }}"
  changed_when: false
  tags:
    - shell
    - shell-install

- name: Shell Config | Install | Validate Starship install/remove controls
  ansible.builtin.assert:
    that:
      - not (shell__install_starship_enabled | bool and
        shell__remove_starship_enabled | bool)
    fail_msg: "shell_install_starship and shell_remove_starship cannot both be true."
    success_msg: "Starship install/remove controls are valid."
  tags:
    - shell
    - shell-install
    - shell-validate

# -----------------------------------------------------------------------------
# Zsh
# -----------------------------------------------------------------------------

- name: Shell Config | Install | Ensure zsh is installed
  ansible.builtin.package:
    name: zsh
    state: present
  become: true
  when: shell__install_zsh_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-zsh

# -----------------------------------------------------------------------------
# Oh My Zsh users
# -----------------------------------------------------------------------------

- name: Shell Config | Install | Build Oh My Zsh user list
  ansible.builtin.set_fact:
    shell__oh_my_zsh_users: >-
      {%- set out = [] -%} {%- for user in shell__install_users -%}
        {%- set shell_path = user.shell | default('') -%}
        {%- if shell_path.endswith('zsh') -%}
          {%- set _ = out.append(user) -%}
        {%- endif -%}
      {%- endfor -%} {{ out }}
  changed_when: false
  when: shell__install_oh_my_zsh_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-oh-my-zsh

- name: Shell Config | Install | Stat Oh My Zsh directories
  ansible.builtin.stat:
    path: "{{ item.home_directory }}/{{ shell_oh_my_zsh_dir | default('.oh-my-zsh')
      }}"
    follow: false
  register: shell__oh_my_zsh_dir_stats
  loop: "{{ shell__oh_my_zsh_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: shell__install_oh_my_zsh_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-oh-my-zsh

- name: Shell Config | Install | Refuse symlinked Oh My Zsh directories
  ansible.builtin.fail:
    msg: >-
      Refusing to manage symlinked Oh My Zsh directory for {{ item.item.name }}:
      {{ item.item.home_directory }}/{{ shell_oh_my_zsh_dir |
      default('.oh-my-zsh') }}
  loop: "{{ shell__oh_my_zsh_dir_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - shell__install_oh_my_zsh_enabled | bool
    - item.stat.islnk | default(false) | bool
  tags:
    - shell
    - shell-install
    - shell-oh-my-zsh

- name: Shell Config | Install | Install Oh My Zsh
  ansible.builtin.git:
    repo: "{{ shell_oh_my_zsh_repo }}"
    dest: "{{ item.home_directory }}/{{ shell_oh_my_zsh_dir | default('.oh-my-zsh')
      }}"
    version: "{{ shell_oh_my_zsh_version | default('master') }}"
    update: "{{ shell_git_update | default(false) | bool }}"
    depth: "{{ shell_git_depth | default(1) | int }}"
    accept_hostkey: "{{ shell_git_accept_hostkey | default(true) | bool }}"
  become: true
  become_user: "{{ item.name }}"
  loop: "{{ shell__oh_my_zsh_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: shell__install_oh_my_zsh_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-oh-my-zsh

- name: Shell Config | Install | Ensure Oh My Zsh ownership and directory mode
  ansible.builtin.file:
    path: "{{ item.home_directory }}/{{ shell_oh_my_zsh_dir | default('.oh-my-zsh')
      }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.shell_config_group | default(item.primary_group |
      default(item.name)) }}"
    mode: "0755"
    recurse: true
  become: true
  loop: "{{ shell__oh_my_zsh_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: shell__install_oh_my_zsh_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-oh-my-zsh

# -----------------------------------------------------------------------------
# Starship cleanup
# -----------------------------------------------------------------------------

- name: Shell Config | Install | Remove starship package when requested
  ansible.builtin.package:
    name: starship
    state: absent
  become: true
  register: shell__starship_package_remove
  failed_when: false
  when: shell__remove_starship_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-starship

- name: Shell Config | Install | Remove starship binaries from common locations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/local/bin/starship
    - /usr/bin/starship
    - /home/linuxbrew/.linuxbrew/bin/starship
    - /opt/homebrew/bin/starship
  loop_control:
    label: "{{ item }}"
  when: shell__remove_starship_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-starship

- name: Shell Config | Install | Remove starship user config paths
  ansible.builtin.file:
    path: "{{ item.0.home_directory }}/{{ item.1 }}"
    state: absent
  become: true
  loop: "{{ shell__install_users | product(['.config/starship',
    '.config/starship.toml']) | list }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  when: shell__remove_starship_enabled | bool
  tags:
    - shell
    - shell-install
    - shell-starship

# -----------------------------------------------------------------------------
# Summary
# -----------------------------------------------------------------------------

- name: Shell Config | Install | Show install summary
  ansible.builtin.debug:
    msg:
      - "shell-config install phase complete."
      - "zsh installed: {{ shell__install_zsh_enabled | bool }}"
      - "Oh My Zsh enabled: {{ shell__install_oh_my_zsh_enabled | bool }}"
      - "Oh My Zsh users: {{ shell__oh_my_zsh_users | default([]) |
        map(attribute='name') | list | join(', ') if shell__oh_my_zsh_users |
        default([]) | length > 0 else 'none' }}"
      - "Starship removed: {{ shell__remove_starship_enabled | bool }}"
  when: shell_config_show_summary | default(true) | bool
  tags:
    - shell
    - shell-install
    - shell-summary
