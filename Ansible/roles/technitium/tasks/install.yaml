---
# =============================================================================
# Technitium DNS - Install Tasks
# -----------------------------------------------------------------------------
# Purpose:
#   - Install Docker Engine on Debian-family hosts
#   - Prepare the Technitium data directory
#   - Stop known local DNS services that conflict with port 53 when requested
#   - Run Technitium DNS Server as a managed Docker container
#
# Design:
#   - Idempotent by default.
#   - No destructive container recreation unless explicitly requested.
#   - No blind process killing on port 53.
#   - Port publishing is derived from role variables.
#   - Cluster node name resolution is supported with Docker extra_hosts.
#
# Companion vars:
#   - Ansible/group_vars/technitium/main.yaml
#   - Ansible/group_vars/technitium/cluster.yaml
#   - Ansible/group_vars/technitium/firewall.yaml
# =============================================================================

- name: Install | Install and run Technitium DNS Server
  become: true
  block:
    # -------------------------------------------------------------------------
    # Guard rails / facts
    # -------------------------------------------------------------------------

    - name: Install | Gather facts when needed
      ansible.builtin.setup:
        gather_timeout: 30
      when: ansible_os_family is not defined

    - name: Install | Assert Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "Technitium role currently supports Debian-family hosts only."
        success_msg: "Detected supported Debian-family host."

    - name: Install | Gather service facts
      ansible.builtin.service_facts:

    # -------------------------------------------------------------------------
    # Defaults
    # -------------------------------------------------------------------------

    - name: Install | Set container defaults
      ansible.builtin.set_fact:
        technitium_container_name: "{{ technitium_container_name | default('technitium') }}"
        technitium_image: "{{ technitium_image | default('technitium/dns-server') }}"
        technitium_image_tag: "{{ technitium_image_tag | default('latest') }}"
        technitium_data_dir: "{{ technitium_data_dir | default('/opt/technitium') }}"
        technitium_http_port: "{{ technitium_http_port | default(5380) }}"
        technitium_https_port: "{{ technitium_https_port | default(53443) }}"
        technitium_dns_port: "{{ technitium_dns_port | default(53) }}"
        technitium_timezone: "{{ technitium_timezone | default('UTC') }}"
        technitium_env: "{{ technitium_env | default({}) }}"
        technitium_restart_policy: "{{ technitium_restart_policy | default('unless-stopped') }}"
        technitium_install_docker_compose_plugin: "{{ technitium_install_docker_compose_plugin | default(false) }}"
        technitium_install_docker_from_official_repo: "{{ technitium_install_docker_from_official_repo | default(true) }}"
        technitium_manage_port53_conflicts: "{{ technitium_manage_port53_conflicts | default(true) }}"
        technitium_container_recreate: "{{ technitium_container_recreate | default(false) }}"
        technitium_container_pull: "{{ technitium_container_pull | default(true) }}"
        technitium_container_restart: "{{ technitium_container_restart | default(false) }}"
        technitium_use_host_network: "{{ technitium_use_host_network | default(false) }}"
        technitium_conflicting_dns_services: "{{ technitium_conflicting_dns_services | default(['systemd-resolved', 'dnsmasq', 'unbound', 'bind9', 'named', 'pihole-FTL']) }}"

    # -------------------------------------------------------------------------
    # Docker repository detection
    # -------------------------------------------------------------------------

    - name: Install | Determine Docker repository distro
      ansible.builtin.set_fact:
        technitium_docker_repo_distro: >-
          {{
            technitium_docker_repo_distro_override
            | default(
                'raspbian'
                if ansible_distribution | lower in ['raspbian', 'raspberry pi os']
                else ansible_distribution | lower
              )
          }}

    - name: Install | Determine Docker repository codename
      ansible.builtin.set_fact:
        technitium_docker_repo_codename: >-
          {{
            technitium_docker_repo_codename_override
            | default(ansible_distribution_release | lower)
          }}

    - name: Install | Build Docker repository URL
      ansible.builtin.set_fact:
        technitium_docker_repo_url: >-
          {{
            technitium_docker_repo_url_override
            | default('https://download.docker.com/linux/' ~ technitium_docker_repo_distro)
          }}

    # -------------------------------------------------------------------------
    # Docker installation
    # -------------------------------------------------------------------------

    - name: Install | Install APT prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600
        install_recommends: false
      register: technitium_install_apt_prereqs
      retries: 3
      delay: 5
      until: technitium_install_apt_prereqs is succeeded

    - name: Install | Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Add Docker GPG key
      ansible.builtin.get_url:
        url: "{{ technitium_docker_repo_url }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: false
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Get dpkg architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: technitium_dpkg_arch
      changed_when: false
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ technitium_dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          {{ technitium_docker_repo_url }}
          {{ technitium_docker_repo_codename }}
          stable
        filename: docker
        state: present
        update_cache: true
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Build Docker package list
      ansible.builtin.set_fact:
        technitium_docker_packages: >-
          {{
            [
              'docker-ce',
              'docker-ce-cli',
              'containerd.io',
              'docker-buildx-plugin'
            ]
            + (
              technitium_install_docker_compose_plugin | bool
              | ternary(['docker-compose-plugin'], [])
            )
          }}
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Install Docker Engine packages
      ansible.builtin.apt:
        name: "{{ technitium_docker_packages }}"
        state: present
        install_recommends: false
      register: technitium_install_docker_engine
      retries: 3
      delay: 5
      until: technitium_install_docker_engine is succeeded
      when: technitium_install_docker_from_official_repo | bool

    - name: Install | Install distribution Docker packages when official repo is disabled
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        install_recommends: false
      register: technitium_install_distro_docker
      retries: 3
      delay: 5
      until: technitium_install_distro_docker is succeeded
      when: not (technitium_install_docker_from_official_repo | bool)

    - name: Install | Install Python Docker SDK
      ansible.builtin.apt:
        name: python3-docker
        state: present
        install_recommends: false
      register: technitium_install_python_docker
      retries: 3
      delay: 5
      until: technitium_install_python_docker is succeeded

    - name: Install | Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    # -------------------------------------------------------------------------
    # Container environment
    # -------------------------------------------------------------------------

    - name: Install | Build base Technitium container environment
      ansible.builtin.set_fact:
        technitium_container_base_env:
          TZ: "{{ technitium_timezone }}"

    - name: Install | Add admin password to container environment when enabled
      ansible.builtin.set_fact:
        technitium_container_base_env: >-
          {{
            technitium_container_base_env
            | combine({'DNS_SERVER_ADMIN_PASSWORD': technitium_admin_password}, recursive=True)
          }}
      when:
        - technitium_set_admin_password_env | default(true)
        - technitium_admin_password is defined
        - technitium_admin_password | length > 0
      no_log: true

    - name: Install | Build final Technitium container environment
      ansible.builtin.set_fact:
        technitium_container_env: "{{ technitium_container_base_env | combine(technitium_env | default({}), recursive=True) }}"
      no_log: true

    # -------------------------------------------------------------------------
    # Cluster extra_hosts
    # -------------------------------------------------------------------------

    - name: Install | Build Technitium cluster host list from inventory
      ansible.builtin.set_fact:
        technitium_cluster_extra_host_inventory: >-
          {{
            (
              groups.get('technitium', [])
              + groups.get('dns', [])
            )
            | unique
            | difference(technitium_cluster_excluded_nodes | default([]))
          }}

    - name: Install | Build extra_hosts mapping for cluster peers
      ansible.builtin.set_fact:
        technitium_container_extra_hosts: >-
          {{
            technitium_container_extra_hosts | default({})
            | combine({
                item: hostvars[item].ansible_host,
                item ~ '.' ~ (technitium_cluster_domain | default('local.sinlessgames.com')): hostvars[item].ansible_host
              }, recursive=True)
          }}
      loop: "{{ technitium_cluster_extra_host_inventory }}"
      when:
        - technitium_cluster_enabled | default(false) | bool
        - hostvars[item] is defined
        - hostvars[item].ansible_host is defined

    # -------------------------------------------------------------------------
    # Published ports
    # -------------------------------------------------------------------------

    - name: Install | Build required published port list
      ansible.builtin.set_fact:
        technitium_container_ports:
          - "{{ technitium_http_port }}:5380/tcp"
          - "{{ technitium_dns_port }}:53/tcp"
          - "{{ technitium_dns_port }}:53/udp"
          - "{{ technitium_https_port }}:53443/tcp"

    - name: Install | Add DNS-over-TLS published port when enabled
      ansible.builtin.set_fact:
        technitium_container_ports: >-
          {{
            technitium_container_ports
            + [technitium_firewall_ports.dns_over_tls | default(853) | string ~ ':853/tcp']
          }}
      when: technitium_firewall_allow_dot | default(false)

    - name: Install | Add DNS-over-HTTPS published port when enabled
      ansible.builtin.set_fact:
        technitium_container_ports: >-
          {{
            technitium_container_ports
            + [technitium_firewall_ports.dns_over_https | default(443) | string ~ ':443/tcp']
          }}
      when: technitium_firewall_allow_doh | default(false)

    - name: Install | Add DNS-over-QUIC published port when enabled
      ansible.builtin.set_fact:
        technitium_container_ports: >-
          {{
            technitium_container_ports
            + [technitium_firewall_ports.dns_over_quic | default(853) | string ~ ':853/udp']
          }}
      when: technitium_firewall_allow_doq | default(false)

    - name: Install | Add DHCP published ports when enabled
      ansible.builtin.set_fact:
        technitium_container_ports: >-
          {{
            technitium_container_ports
            + [
                technitium_firewall_ports.dhcp_server | default(67) | string ~ ':67/udp',
                technitium_firewall_ports.dhcp_client | default(68) | string ~ ':68/udp'
              ]
          }}
      when: technitium_firewall_allow_dhcp | default(false)

    - name: Install | Deduplicate published port list
      ansible.builtin.set_fact:
        technitium_container_ports: "{{ technitium_container_ports | unique | list }}"

    # -------------------------------------------------------------------------
    # Existing container detection
    # -------------------------------------------------------------------------

    - name: Install | Check if Technitium container already exists
      community.docker.docker_container_info:
        name: "{{ technitium_container_name }}"
      register: technitium_container_info
      failed_when: false

    - name: Install | Set Technitium container existence flag
      ansible.builtin.set_fact:
        technitium_container_exists: "{{ technitium_container_info.exists | default(false) | bool }}"

    # -------------------------------------------------------------------------
    # Port 53 conflict handling
    # -------------------------------------------------------------------------

    - name: Install | Stop and disable known conflicting DNS services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ technitium_conflicting_dns_services }}"
      when:
        - technitium_manage_port53_conflicts | bool
        - item ~ '.service' in ansible_facts.services or item in ansible_facts.services
      failed_when: false

    - name: Install | Check TCP listeners on port 53
      ansible.builtin.shell: |
        set -o pipefail
        ss -H -ltnup '( sport = :53 )' || true
      args:
        executable: /bin/bash
      register: technitium_tcp53
      changed_when: false
      when:
        - technitium_manage_port53_conflicts | bool
        - not technitium_container_exists | bool

    - name: Install | Check UDP listeners on port 53
      ansible.builtin.shell: |
        set -o pipefail
        ss -H -lnup '( sport = :53 )' || true
      args:
        executable: /bin/bash
      register: technitium_udp53
      changed_when: false
      when:
        - technitium_manage_port53_conflicts | bool
        - not technitium_container_exists | bool

    - name: Install | Fail if port 53 is still busy before first install
      ansible.builtin.fail:
        msg: |
          Port 53 is still in use by a non-Technitium service.

          TCP listeners:
          {{ technitium_tcp53.stdout | default('none') }}

          UDP listeners:
          {{ technitium_udp53.stdout | default('none') }}

          Resolve the listener before starting the Technitium container.
      when:
        - technitium_manage_port53_conflicts | bool
        - not technitium_container_exists | bool
        - (technitium_tcp53.stdout | default('') | length > 0) or (technitium_udp53.stdout | default('') | length > 0)

    # -------------------------------------------------------------------------
    # Data directory
    # -------------------------------------------------------------------------

    - name: Install | Ensure Technitium data directory exists
      ansible.builtin.file:
        path: "{{ technitium_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # -------------------------------------------------------------------------
    # Intentional container replacement
    # -------------------------------------------------------------------------

    - name: Install | Stop existing Technitium container when recreation is requested
      community.docker.docker_container:
        name: "{{ technitium_container_name }}"
        state: stopped
      when:
        - technitium_container_recreate | bool
        - technitium_container_exists | bool

    - name: Install | Remove existing Technitium container when recreation is requested
      community.docker.docker_container:
        name: "{{ technitium_container_name }}"
        state: absent
        force_kill: false
      when:
        - technitium_container_recreate | bool
        - technitium_container_exists | bool

    - name: Install | Re-check Technitium container after optional recreation
      community.docker.docker_container_info:
        name: "{{ technitium_container_name }}"
      register: technitium_container_info_after_recreate
      failed_when: false

    - name: Install | Refresh Technitium container existence flag
      ansible.builtin.set_fact:
        technitium_container_exists: "{{ technitium_container_info_after_recreate.exists | default(false) | bool }}"

    # -------------------------------------------------------------------------
    # Image
    # -------------------------------------------------------------------------

    - name: Install | Pull Technitium image
      community.docker.docker_image:
        name: "{{ technitium_image }}"
        tag: "{{ technitium_image_tag }}"
        source: pull
        force_source: "{{ technitium_container_pull | bool }}"
      when: technitium_pull_image_separately | default(true)

    # -------------------------------------------------------------------------
    # Container
    # -------------------------------------------------------------------------

    - name: Install | Run Technitium DNS container with published ports
      community.docker.docker_container:
        name: "{{ technitium_container_name }}"
        image: "{{ technitium_image }}:{{ technitium_image_tag }}"
        state: started
        restart_policy: "{{ technitium_restart_policy }}"
        recreate: "{{ technitium_container_recreate | bool }}"
        restart: "{{ technitium_container_restart | bool }}"
        hostname: "{{ inventory_hostname }}"
        published_ports: "{{ technitium_container_ports }}"
        volumes:
          - "{{ technitium_data_dir }}:/etc/technitium"
        env: "{{ technitium_container_env }}"
        etc_hosts: "{{ technitium_container_extra_hosts | default({}) }}"
        capabilities:
          - NET_BIND_SERVICE
        labels:
          managed-by: "ansible"
          app.kubernetes.io/name: "technitium"
          app.kubernetes.io/component: "dns"
          app.kubernetes.io/part-of: "technitium"
          sinlessgames.io/environment: "{{ technitium_environment | default('prod') }}"
      register: technitium_container_run
      no_log: "{{ technitium_hide_container_env | default(true) }}"
      when: not (technitium_use_host_network | bool)

    - name: Install | Run Technitium DNS container with host networking
      community.docker.docker_container:
        name: "{{ technitium_container_name }}"
        image: "{{ technitium_image }}:{{ technitium_image_tag }}"
        state: started
        restart_policy: "{{ technitium_restart_policy }}"
        recreate: "{{ technitium_container_recreate | bool }}"
        restart: "{{ technitium_container_restart | bool }}"
        hostname: "{{ inventory_hostname }}"
        network_mode: host
        volumes:
          - "{{ technitium_data_dir }}:/etc/technitium"
        env: "{{ technitium_container_env }}"
        etc_hosts: "{{ technitium_container_extra_hosts | default({}) }}"
        capabilities:
          - NET_BIND_SERVICE
        labels:
          managed-by: "ansible"
          app.kubernetes.io/name: "technitium"
          app.kubernetes.io/component: "dns"
          app.kubernetes.io/part-of: "technitium"
          sinlessgames.io/environment: "{{ technitium_environment | default('prod') }}"
      register: technitium_container_run_host_network
      no_log: "{{ technitium_hide_container_env | default(true) }}"
      when: technitium_use_host_network | bool

    # -------------------------------------------------------------------------
    # Post-install checks
    # -------------------------------------------------------------------------

    - name: Install | Wait for Technitium HTTP API port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ technitium_http_port }}"
        timeout: "{{ technitium_http_wait_timeout | default(120) }}"
        delay: "{{ technitium_http_wait_delay | default(5) }}"
        state: started

    - name: Install | Wait for Technitium DNS TCP port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ technitium_dns_port }}"
        timeout: "{{ technitium_dns_wait_timeout | default(120) }}"
        delay: "{{ technitium_dns_wait_delay | default(5) }}"
        state: started

    - name: Install | Check Technitium container state
      community.docker.docker_container_info:
        name: "{{ technitium_container_name }}"
      register: technitium_container_final_info
      failed_when: false

    - name: Install | Assert Technitium container is running
      ansible.builtin.assert:
        that:
          - technitium_container_final_info.exists | default(false) | bool
          - technitium_container_final_info.container.State.Running | default(false) | bool
        fail_msg: "Technitium container is not running."
        success_msg: "Technitium container is running."

    - name: Install | Show Technitium install summary
      ansible.builtin.debug:
        msg:
          - "Technitium install complete."
          - "Host: {{ inventory_hostname }}"
          - "Container: {{ technitium_container_name }}"
          - "Image: {{ technitium_image }}:{{ technitium_image_tag }}"
          - "Data directory: {{ technitium_data_dir }}"
          - "HTTP API: http://{{ ansible_host | default(inventory_hostname) }}:{{ technitium_http_port }}"
          - "DNS port: {{ technitium_dns_port }}"
          - "Host network: {{ technitium_use_host_network | bool }}"
          - "Published ports: {{ technitium_container_ports | join(', ') if not (technitium_use_host_network | bool) else 'host network' }}"

  rescue:
    - name: Install | Show Docker service status
      ansible.builtin.command:
        cmd: systemctl status docker --no-pager
      register: technitium_docker_status
      changed_when: false
      failed_when: false

    - name: Install | Show Technitium container logs
      ansible.builtin.command:
        cmd: "docker logs --tail 100 {{ technitium_container_name | default('technitium') }}"
      register: technitium_container_logs
      changed_when: false
      failed_when: false

    - name: Install | Print install failure diagnostics
      ansible.builtin.debug:
        msg:
          - "Technitium install failed."
          - "Docker status:"
          - "{{ technitium_docker_status.stdout_lines | default([]) }}"
          - "Container logs:"
          - "{{ technitium_container_logs.stdout_lines | default([]) }}"

    - name: Install | Fail Technitium install
      ansible.builtin.fail:
        msg: "Technitium installation failed. Review diagnostics above."