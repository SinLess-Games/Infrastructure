[defaults]
# =============================================================================
# Core paths
# =============================================================================

inventory = ./inventory

# First-party roles first, then repo-local Galaxy/vendor paths, then fallbacks.
roles_path = ./roles:./.collections/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Collections path should point at the directory that contains ansible_collections/.
collections_path = ./.collections:~/.ansible/collections:/usr/share/ansible/collections

# Runtime state
local_tmp = ./.ansible/tmp
remote_tmp = ~/.ansible/tmp
log_path = ./.ansible/ansible.log

# =============================================================================
# Execution behavior
# =============================================================================

interpreter_python = auto_silent
forks = 10
timeout = 120
gather_timeout = 120

# Privilege escalation
become = True
become_method = sudo
become_ask_pass = False

# =============================================================================
# Output and UX
# =============================================================================

# Avoid the older stdout_callback=yaml dependency.
# The default callback can render results as YAML on newer ansible-core.
stdout_callback = default
result_format = yaml

bin_ansible_callbacks = True
display_skipped_hosts = False
display_args_to_stdout = False
display_ok_hosts = True
display_unreachable_hosts = True
show_task_path_on_failure = True
nocows = True
force_color = True
verbosity = 0

# =============================================================================
# Fact handling
# =============================================================================

gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible/facts
fact_caching_timeout = 86400

# =============================================================================
# SSH behavior
# =============================================================================

host_key_checking = True

# =============================================================================
# Error handling and safety
# =============================================================================

error_on_undefined_vars = True
any_errors_fatal = True

# Keep deprecations visible while developing roles.
deprecation_warnings = True

# =============================================================================
# Inventory behavior
# =============================================================================

localhost_warning = False
inventory_unparsed_warning = True

[ssh_connection]
pipelining = True
scp_if_ssh = False
retries = 3
control_path_dir = ./.ansible/cp

# Keep SSH key auth enforced. accept-new gives safer first-connect behavior
# than disabling host key checking globally, while still failing on changed keys.
#
# Legacy ssh-rsa is allowed because some Proxmox nodes may still advertise it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa

[galaxy]
role_skeleton_ignore = tests,docs