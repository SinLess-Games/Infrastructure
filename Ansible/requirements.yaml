---
# =============================================================================
# Ansible Galaxy Requirements
# -----------------------------------------------------------------------------
# Purpose:
#   Pinned Ansible Galaxy collections and roles for deterministic infrastructure
#   automation in the Infrastructure repo.
#
# Supports:
#   - Linux system baselining
#   - Docker / container automation
#   - Proxmox VE automation
#   - RKE2 / Kubernetes management
#   - Technitium DNS automation
#   - Cloudflare DNS / tunnel automation
#   - PostgreSQL automation
#   - TLS / PKI workflows
#
# Install:
#   ansible-galaxy collection install -r Ansible/requirements.yaml \
#     -p Ansible/.collections
#
#   ansible-galaxy role install -r Ansible/requirements.yaml \
#     -p Ansible/.collections/roles
#
# Notes:
#   - Collections are pinned to exact versions.
#   - Git roles must use a real tag, branch, or commit hash.
#   - This file is designed for ansible-core 2.20.x.
#   - Python dependencies are installed separately from:
#       Ansible/requirements.txt
# =============================================================================

collections:
  # ---------------------------------------------------------------------------
  # Core / Utility
  # ---------------------------------------------------------------------------

  # POSIX-level system management:
  #   - sysctl
  #   - mount
  #   - authorized_key
  #   - firewalld
  #   - profile tasks used across Linux hosts
  - name: ansible.posix
    version: "2.2.2"

  # Data manipulation helpers:
  #   - ipaddr / network filters
  #   - validation helpers
  #   - CLI parsing helpers
  - name: ansible.utils
    version: "6.1.0"

  # Broad community modules and plugins:
  #   - filesystem helpers
  #   - package/system utilities
  #   - Proxmox inventory helpers
  #   - general-purpose filters/lookups
  - name: community.general
    version: "12.6.0"

  # Cryptography / PKI:
  #   - certificate generation
  #   - CSR handling
  #   - SSH key operations
  #   - local CA workflows
  - name: community.crypto
    version: "3.4.0"

  # ---------------------------------------------------------------------------
  # Docker / Container Runtime
  # ---------------------------------------------------------------------------

  # Docker automation:
  #   - docker_container
  #   - docker_image
  #   - docker_container_info
  #   - Docker network/volume helpers
  #
  # Used by:
  #   - Technitium Docker deployment
  #   - Local service/container roles
  - name: community.docker
    version: "5.3.0"

  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------

  # PostgreSQL automation:
  #   - databases
  #   - users/roles
  #   - privileges
  #   - extensions
  #
  # Useful for:
  #   - app databases
  #   - platform service databases
  #   - future Helix AI infrastructure
  - name: community.postgresql
    version: "4.2.0"

  # ---------------------------------------------------------------------------
  # Kubernetes / RKE2
  # ---------------------------------------------------------------------------

  # Canonical Kubernetes collection:
  #   - k8s
  #   - k8s_info
  #   - helm
  #   - helm_repository
  #   - k8s_json_patch
  #
  # Prefer this over the older community.kubernetes collection.
  - name: kubernetes.core
    version: "6.5.0"

  # ---------------------------------------------------------------------------
  # DNS Management - Technitium
  # ---------------------------------------------------------------------------

  # Technitium DNS Server management modules:
  #   - authentication
  #   - zones
  #   - records
  #   - cluster state
  #   - server settings
  #
  # The custom role currently uses direct API calls, but this collection is kept
  # available for future module-backed refactors.
  - name: effectivelywild.technitium_dns
    version: "1.1.2"

  # ---------------------------------------------------------------------------
  # Hypervisor / Proxmox
  # ---------------------------------------------------------------------------

  # Proxmox API modules:
  #   - VM lifecycle
  #   - containers
  #   - storage
  #   - pools
  #   - users/tokens
  #
  # Terraform remains the primary provisioning path for new VM clusters, but
  # this collection is useful for day-2 Proxmox automation.
  - name: community.proxmox
    version: "1.6.0"

  # ---------------------------------------------------------------------------
  # Cloudflare
  # ---------------------------------------------------------------------------

  # Cloudflare automation:
  #   - DNS zones
  #   - DNS records
  #   - Cloudflare account resources
  #   - tunnel-adjacent automation where supported by the collection
  - name: linuxhq.cloudflare
    version: "2.0.5"

# =============================================================================
# Roles
# =============================================================================

roles:
  # ---------------------------------------------------------------------------
  # Kubernetes: RKE2
  # ---------------------------------------------------------------------------

  # Rancher Kubernetes Engine 2 role.
  #
  # Used for:
  #   - HA production RKE2 clusters
  #   - staging clusters
  #   - Proxmox-backed Kubernetes VMs
  #
  # Notes:
  #   - Keep this pinned.
  #   - Upgrade only with RKE2 version testing.
  - name: lablabs.rke2
    version: "1.53.1"

  # ---------------------------------------------------------------------------
  # Proxmox VE: node / cluster configuration
  # ---------------------------------------------------------------------------

  # Proxmox VE host/cluster configuration role.
  #
  # Notes:
  #   - This is separate from Terraform VM provisioning.
  #   - `version` must match a real git tag, branch, or commit hash.
  #   - Keep this pinned unless you validate the role against your Proxmox nodes.
  #
  # To verify tags:
  #   git ls-remote --tags https://github.com/lae/ansible-role-proxmox.git
  #
  # To pin harder:
  #   Replace version with a commit SHA.
  - name: lae.proxmox
    src: git+https://github.com/lae/ansible-role-proxmox.git
    scm: git
    version: "v1.10.1"

# =============================================================================
# Removed / Replaced
# -----------------------------------------------------------------------------
# community.kubernetes:
#   Removed from active requirements. Prefer kubernetes.core.
#
# Older pins replaced:
#   ansible.posix              1.6.2  -> 2.1.0
#   ansible.utils              5.1.2  -> 6.0.0
#   community.general          9.1.0  -> 12.6.0
#   community.crypto           2.22.3 -> 3.2.0
#   community.docker           3.13.1 -> 5.2.0
#   community.postgresql       3.6.0  -> 4.2.0
#   kubernetes.core            5.0.0  -> 6.4.0
#   effectivelywild.technitium_dns 1.1.1 -> 1.1.2
#   community.proxmox          1.4.0  -> 1.6.0
#   linuxhq.cloudflare         2.0.3  -> 2.0.5
#   lablabs.rke2               1.50.1 -> 1.51.0
#
# Python dependencies:
#   Install separately with:
#     python -m pip install -r Ansible/requirements.txt
#
# Validate after install:
#   ansible-galaxy collection list
#   ansible-galaxy role list
#   ansible-lint Ansible/
#
# Last reviewed: 2026-05
# =============================================================================