---
# =============================================================================
# Technitium Deployment Variables
# =============================================================================

# Terraform module configuration
technitium_module_source: "./modules/proxmox-vm-cluster"

# Proxmox API access for Terraform
technitium_proxmox_api_url: "{{ infra_proxmox_api_url }}"
technitium_proxmox_tls_insecure: "{{ infra_proxmox_tls_insecure }}"
technitium_proxmox_api_token_file: "{{ infra_proxmox_api_token_file }}"

# Cluster identity
technitium_cluster_name: "technitium-cluster"
technitium_environment: "prod"

# Proxmox placement
# DNS cluster nodes are distributed across the strongest Proxmox hosts.
technitium_target_nodes:
  - "pve-01"
  - "pve-04"
  - "pve-05"

# VM naming and IDs
technitium_node_count: 3
technitium_node_name_prefix: "dns"
technitium_vm_id_start: 200

# Network configuration
# VLAN 1 / untagged infrastructure network: 10.10.10.0/24
technitium_vlan_id: 0
technitium_network_bridge: "vmbr0"
technitium_gateway: "10.10.10.1"
technitium_cidr_subnet: "/24"
technitium_nameservers: "1.1.1.1 8.8.8.8"

technitium_ip_addresses:
  - "10.10.10.20"
  - "10.10.10.21"
  - "10.10.10.22"

# =============================================================================
# Proxmox Template and Storage Mapping
# -----------------------------------------------------------------------------
# Use per-node mappings because Proxmox templates and storage IDs are local to
# each Proxmox node unless shared storage is used.
#
# Update these values to match the exact Proxmox storage IDs and template names
# visible in the Proxmox UI/API.
# =============================================================================

technitium_clone_templates_by_node:
  pve-01: "debian-13-template-pve-01"
  pve-04: "debian-13-template-pve-04"
  pve-05: "debian-13-template-pve-05"

technitium_storage_by_node:
  pve-01: "vm_disks_01"
  pve-04: "vm_disks_04"
  pve-05: "vm_disks_05"

# Backward-compatible defaults.
# Existing Terraform/module logic that expects single values can still use these.
technitium_clone_template: "{{ technitium_clone_templates_by_node[technitium_target_nodes[0]] }}"
technitium_storage: "{{ technitium_storage_by_node[technitium_target_nodes[0]] }}"

# Full explicit VM layout for modules/tasks that support per-node configuration.
technitium_vm_nodes:
  - name: "dns-01"
    vm_id: 200
    target_node: "pve-01"
    ip_address: "10.10.10.20"
    clone_template: "{{ technitium_clone_templates_by_node['pve-01'] }}"
    storage: "{{ technitium_storage_by_node['pve-01'] }}"

  - name: "dns-02"
    vm_id: 201
    target_node: "pve-04"
    ip_address: "10.10.10.21"
    clone_template: "{{ technitium_clone_templates_by_node['pve-04'] }}"
    storage: "{{ technitium_storage_by_node['pve-04'] }}"

  - name: "dns-03"
    vm_id: 202
    target_node: "pve-05"
    ip_address: "10.10.10.22"
    clone_template: "{{ technitium_clone_templates_by_node['pve-05'] }}"
    storage: "{{ technitium_storage_by_node['pve-05'] }}"

# Resource allocation
technitium_cpu_cores: 2
technitium_cpu_sockets: 1
technitium_memory_mb: 4096
technitium_disk_size: "40G"

# Access configuration
technitium_default_user: "{{ infra_bootstrap_default_user }}"
technitium_ansible_user: "ansible"

# SSH keys for VM access
technitium_ssh_keys: "{{ infra_bootstrap_ssh_keys }}"

# HA and backup
technitium_ha_enabled: true
technitium_ha_group: "dns-ha"

technitium_backup_enabled: true
technitium_backup_schedule: "0 3 * * *"

# VM lifecycle options
technitium_start_at_node_boot: true
technitium_agent_enabled: true
technitium_protection: true
technitium_startup_order: 20

# Tags and metadata
technitium_tags:
  - "technitium"
  - "dns"
  - "ha"
  - "terraform-managed"

technitium_description: "Technitium DNS cluster node managed by Terraform and Ansible"