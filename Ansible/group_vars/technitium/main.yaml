---
# =============================================================================
# Technitium DNS - Main Group Variables
# -----------------------------------------------------------------------------
# Purpose:
#   Central defaults and role compatibility variables for Technitium DNS.
#
# Design:
#   - Keep secrets out of plaintext group_vars.
#   - Keep block list sources in block-lists.yaml.
#   - Keep authoritative zones in domains.yaml.
#   - Keep forward records in domain-records.yaml.
#   - Keep PTR records in reverse-zones.yaml.
#   - Keep firewall policy in firewall.yaml.
#
# Expected companion files:
#   - Ansible/group_vars/technitium/block-lists.yaml
#   - Ansible/group_vars/technitium/cluster.yaml
#   - Ansible/group_vars/technitium/domain-records.yaml
#   - Ansible/group_vars/technitium/domains.yaml
#   - Ansible/group_vars/technitium/firewall.yaml
#   - Ansible/group_vars/technitium/reverse-zones.yaml
#   - Ansible/group_vars/technitium/technitium-vms.yaml
# =============================================================================

# =============================================================================
# Service Identity
# =============================================================================

technitium_service_name: "technitium"
technitium_environment: "prod"
technitium_managed_by: "ansible"
technitium_owner: "SinLess Games LLC"

technitium_node_name: "{{ inventory_hostname }}"
technitium_node_ip: "{{ ansible_host }}"

# =============================================================================
# Technitium Web/API Ports
# =============================================================================

technitium_http_port: 5380
technitium_https_port: 53443
technitium_dns_port: 53

# Primary API URL used by the role.
# Keep HTTP for bootstrap because HTTPS may not exist until after initial setup.
technitium_api_scheme: "http"
technitium_api_host: "{{ ansible_host }}"
technitium_api_port: "{{ technitium_http_port }}"
technitium_api_url: "{{ technitium_api_scheme }}://{{ technitium_api_host }}:{{ technitium_api_port }}"

# HTTPS API URL for post-bootstrap checks, clustering, and future hardening.
technitium_https_api_url: "https://{{ ansible_host }}:{{ technitium_https_port }}"

# Set to true only after trusted certificates are deployed.
technitium_validate_certs: false

# =============================================================================
# API Behavior
# =============================================================================

technitium_api_timeout: 90
technitium_api_delay: 5
technitium_api_retries: 12

technitium_api_headers:
  Accept: "application/json"

technitium_token_name: "ansible"

# Controller-side outputs.
# controller == machine running ansible
technitium_output_dir: "{{ playbook_dir }}/../../.outputs/technitium"
technitium_token_file: "{{ technitium_output_dir }}/{{ inventory_hostname }}.api-token"

# =============================================================================
# Authentication
# -----------------------------------------------------------------------------
# Do not store real passwords directly in this file.
#
# Recommended:
#   Store vault_technitium_admin_password in Ansible Vault, SOPS, or another
#   secret backend.
#
# Example encrypted variable name:
#   vault_technitium_admin_password
# =============================================================================

technitium_admin_username: "admin"
technitium_admin_password: "{{ vault_technitium_admin_password }}"
technitium_default_password: "{{ vault_technitium_default_password | default(technitium_admin_password) }}"

# =============================================================================
# DNS Forwarders
# -----------------------------------------------------------------------------
# These are public upstream resolvers used by Technitium for recursive queries.
#
# Ordering:
#   - Cloudflare
#   - Quad9
#   - Google
#
# Internal authoritative zones are still served locally by Technitium.
# =============================================================================

technitium_forwarders:
  - "1.1.1.1"
  - "1.0.0.1"
  - "9.9.9.9"
  - "149.112.112.112"
  - "8.8.8.8"
  - "8.8.4.4"

technitium_forwarder_protocol: "udp"
technitium_forwarder_timeout: 5000
technitium_forwarder_retries: 3

# Prefer local authoritative answers for internal zones.
technitium_prefer_ipv6: false
technitium_enable_dnssec_validation: true
technitium_enable_qname_minimization: true
technitium_enable_serve_stale: true

# =============================================================================
# Recursion Policy
# -----------------------------------------------------------------------------
# Allow recursive DNS resolution only from trusted internal networks.
# =============================================================================

technitium_allow_recursion: true

technitium_allow_recursion_cidrs:
  - "10.10.10.0/24"
  - "10.10.20.0/24"
  - "10.10.30.0/24"
  - "10.10.40.0/24"
  - "10.10.50.0/24"

technitium_deny_recursion_cidrs:
  - "0.0.0.0/0"
  - "::/0"

# =============================================================================
# Blocking / Sinkhole Policy
# -----------------------------------------------------------------------------
# Block list sources live in:
#   Ansible/group_vars/technitium/block-lists.yaml
#
# That file should define:
#   technitium_block_list_sources
#   technitium_block_list_urls
#
# Do not redefine technitium_block_list_urls here, otherwise this file may
# override the cleaner source-of-truth block list configuration.
# =============================================================================

technitium_enable_blocking: true
technitium_blocking_enabled: "{{ technitium_enable_blocking }}"

technitium_blocking_type: "AnyAddress"
technitium_blocking_any_address: "0.0.0.0"
technitium_blocking_ttl: 300

technitium_blocking_update_enabled: true
technitium_blocking_update_interval_hours: 24

# Local allow/deny hooks.
# The block-lists.yaml file may also define these. These defaults are safe if
# no local entries exist yet.
technitium_allow_domains: "{{ technitium_allow_domains | default([]) }}"
technitium_deny_domains: "{{ technitium_deny_domains | default([]) }}"

# =============================================================================
# Authoritative DNS Zones
# -----------------------------------------------------------------------------
# Source files:
#   - domains.yaml
#   - domain-records.yaml
#   - reverse-zones.yaml
# =============================================================================

# Role compatibility mappings.
technitium_dns_zones: "{{ technitium_domains }}"
technitium_dns_zone_records: "{{ technitium_domain_records }}"
technitium_dns_reverse_zones: "{{ technitium_reverse_zones | default([]) }}"

# Defaults for records.
technitium_record_default_ttl: 300
technitium_record_default_type: "A"

technitium_manage_forward_zones: true
technitium_manage_reverse_zones: true
technitium_manage_zone_records: true
technitium_manage_ptr_records: true

# If true, role tasks may remove records not declared in Ansible.
# Keep false until you are confident the role owns every record in Technitium.
technitium_prune_unmanaged_records: false

# =============================================================================
# Zone Safety
# =============================================================================

technitium_authoritative_zone_defaults:
  type: "primary"
  internal_only: true
  allow_dynamic_updates: false
  allow_zone_transfer: false
  dnssec_enabled: false

technitium_denied_zones:
  - "local.sinlessgamesllc.com"

# =============================================================================
# Cache Defaults
# =============================================================================

technitium_cache_enabled: true
technitium_cache_min_ttl: 30
technitium_cache_max_ttl: 86400
technitium_cache_negative_ttl: 300
technitium_cache_prefetch_enabled: true
technitium_cache_serve_stale_enabled: true

# =============================================================================
# Logging Defaults
# =============================================================================

technitium_logging_enabled: true
technitium_query_logging_enabled: true
technitium_log_retention_days: 14

# Keep full query logs local unless explicitly shipped by another role.
technitium_log_export_enabled: false

# =============================================================================
# Web UI / Admin Access
# =============================================================================

technitium_web_ui_enabled: true

# Admin/API access should be restricted by firewall.yaml.
technitium_web_allowed_cidrs:
  - "10.10.10.0/24"
  - "10.10.20.0/24"

# =============================================================================
# Cluster Compatibility
# -----------------------------------------------------------------------------
# cluster.yaml owns the real cluster settings. These variables are compatibility
# helpers for role tasks that need to branch on node behavior.
# =============================================================================

technitium_cluster_manage_enabled: "{{ technitium_cluster_enabled | default(false) }}"
technitium_cluster_is_primary: "{{ inventory_hostname == (technitium_cluster_primary_host | default('')) }}"
technitium_cluster_is_secondary: >-
  {{
    technitium_cluster_manage_enabled
    and not technitium_cluster_is_primary
    and inventory_hostname not in (technitium_cluster_excluded_nodes | default([]))
  }}

# =============================================================================
# Service Management
# =============================================================================

technitium_service_enabled: true
technitium_service_state: "started"
technitium_restart_on_config_change: true

technitium_systemd_unit_name: "dns"

# =============================================================================
# Validation
# =============================================================================

technitium_validation_enabled: true

technitium_validation:
  require_api_url: true
  require_admin_password: true
  require_forwarders: true
  require_recursion_restriction: true
  require_blocking_sources_when_blocking_enabled: true
  require_forward_zones: true
  require_no_removed_zones: true
  require_no_plaintext_public_recursion: true

  required_forward_zones:
    - "local.sinlessgames.com"
    - "local.helixaibot.com"

  denied_zones:
    - "local.sinlessgamesllc.com"

  denied_recursion_cidrs:
    - "0.0.0.0/0"
    - "::/0"

# =============================================================================
# Notes
# -----------------------------------------------------------------------------
# - This file intentionally does not define technitium_block_list_urls.
#   block-lists.yaml owns that variable.
#
# - This file intentionally does not define host records.
#   domain-records.yaml owns forward records.
#
# - This file intentionally does not define PTR records.
#   reverse-zones.yaml owns PTR records.
#
# - Store vault_technitium_admin_password outside plaintext git.
# =============================================================================