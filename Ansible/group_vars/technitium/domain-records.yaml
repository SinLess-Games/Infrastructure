      - name: "vault-api"
        type: "CNAME"
        value: "vault.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
        comment: "Vault API alias."

      - name: "_https._tcp.vault"
        type: "SRV"
        value: "10 100 {{ technitium_service_ports.vault_api }} vault.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
