      - name: "_https._tcp.garage-admin"
        type: "SRV"
        value: "10 100 {{ technitium_service_ports.garage_admin }} garage.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
        comment: "Garage admin endpoint service discovery record."

      # -----------------------------------------------------------------------
      # Kubernetes staging cluster - VIPs
      # -----------------------------------------------------------------------

      - name: "k8s-staging-api"
        type: "A"
        value: "{{ technitium_kubernetes_ips.staging.api_vip }}"
        ttl: "{{ technitium_ttl_defaults.vip }}"
        comment: "Kubernetes staging API server VIP."

      - name: "api.staging.k8s"
        type: "CNAME"
        value: "k8s-staging-api.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
        comment: "Kubernetes staging API server alias."

      - name: "staging-api.k8s"
        type: "CNAME"
        value: "k8s-staging-api.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
