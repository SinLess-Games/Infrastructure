      - name: "_https._tcp.proxmox"
        type: "SRV"
        value: "20 100 {{ technitium_service_ports.proxmox_https }} pve-05.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
        comment: "Proxmox HTTPS UI/API service discovery endpoint."

      # -----------------------------------------------------------------------
      # Vault
      # -----------------------------------------------------------------------

