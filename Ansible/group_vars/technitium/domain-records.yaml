        value: "garage-s3.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
        comment: "Internal S3-compatible object storage alias backed by Garage."

      - name: "_s3._tcp.garage"
        type: "SRV"
        value: "10 100 {{ technitium_service_ports.garage_s3 }} garage.local.sinlessgames.com."
        ttl: "{{ technitium_ttl_defaults.service }}"
