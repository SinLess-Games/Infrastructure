---
# Ansible/group_vars/packer/main.yaml
#
# Packer configuration for Proxmox template VM builds.
#
# This file controls:
#   - Which Linux distributions are turned into Proxmox templates
#   - Which Proxmox nodes receive those templates
#   - Where generated Packer files are written
#   - Which Proxmox storage IDs are used
#   - Which installer method each distro uses
#   - Which ISO URLs are downloaded and uploaded to Proxmox
#   - Which SSH identity Ansible uses to upload ISO files to Proxmox
#
# Generated output layout:
#   Packer/<distro>/
#
# Examples:
#   Packer/debian-12/debian-12.pkr.hcl
#   Packer/debian-13/debian-13.pkr.hcl
#   Packer/ubuntu-22.04/ubuntu-22.04.pkr.hcl
#
# Generated installer files:
#   Packer/debian-12/http/preseed.cfg
#   Packer/debian-13/http/preseed.cfg
#   Packer/ubuntu-22.04/http/user-data
#   Packer/ubuntu-22.04/http/meta-data
#   Packer/ubuntu-22.04/http/vendor-data
#
# Template VM naming:
#   <distro>-template-<node_hostname>
#
# Examples:
#   debian-12-template-pve-01
#   debian-13-template-pve-03
#   ubuntu-22.04-template-pve-05
#
# Template VM IDs:
#   VM IDs start at packer_vm_id_base and increment per distro/node pair.
#
# Example with:
#   packer_vm_id_base: 9000
#   packer_distros:
#     - debian-12
#     - debian-13
#     - ubuntu-22.04
#   packer_target_nodes:
#     - pve-01
#     - pve-03
#     - pve-04
#     - pve-05
#
# Result:
#   debian-12 @ pve-01      -> 9000
#   debian-12 @ pve-03      -> 9001
#   debian-12 @ pve-04      -> 9002
#   debian-12 @ pve-05      -> 9003
#   debian-13 @ pve-01      -> 9004
#   debian-13 @ pve-03      -> 9005
#   debian-13 @ pve-04      -> 9006
#   debian-13 @ pve-05      -> 9007
#   ubuntu-22.04 @ pve-01   -> 9008
#   ubuntu-22.04 @ pve-03   -> 9009
#   ubuntu-22.04 @ pve-04   -> 9010
#   ubuntu-22.04 @ pve-05   -> 9011

# -----------------------------------------------------------------------------
# Repository-relative generated file paths
# -----------------------------------------------------------------------------

# Root Packer output directory.
#
# This anchors generated files at the repository root under:
#   Packer/
#
# Do not point this at:
#   Ansible/playbooks/Packer/
packer_root_dir: "{{ playbook_dir }}/../../Packer"

# Generated Packer var-files.
#
# These are generated by Ansible and consumed by:
#   packer validate -var-file=<file>
#   packer build -var-file=<file>
#
# These var-files should not contain API token secrets.
packer_generated_vars_dir: "{{ playbook_dir }}/../generated/packer"

# Local ISO cache directory.
#
# The role downloads installer ISOs here first, then uploads them to each target
# Proxmox node if they are missing from that node's ISO storage path.
#
# Example local cache:
#   Packer/.iso-cache/debian-12.13.0-amd64-netinst.iso
packer_iso_cache_dir: "{{ playbook_dir }}/../../Packer/.iso-cache"

# -----------------------------------------------------------------------------
# Template identity and VM ID behavior
# -----------------------------------------------------------------------------

# Base VM ID for generated Proxmox templates.
#
# Template IDs are assigned deterministically based on the distro/node loop.
# Start template IDs at 9000 to keep them separate from normal workload VMs.
packer_vm_id_base: 9000

# Template name pattern.
#
# Keep this as literal braces, not Jinja braces.
#
# Correct:
#   {distro}-template-{node}
#
# Wrong:
#   "{{distro}}-template-{{node}}"
#
# The role currently builds vm_name directly from distro/node, but this variable
# is kept for compatibility and documentation.
packer_template_name_pattern: "{distro}-template-{node}"

# List of Proxmox node hostnames where templates should be created.
#
# These values are used for:
#   - Packer's proxmox_node variable
#   - SSH/SCP ISO upload target lookup
#   - Template VM name suffix
#
# These must match the actual Proxmox node names known by the Proxmox cluster.
packer_target_nodes:
  - pve-01
  # - pve-03
  - pve-04
  - pve-05

# -----------------------------------------------------------------------------
# Proxmox API connection
# -----------------------------------------------------------------------------

# Proxmox API endpoint used by generated Packer var-files.
#
# This should point at a reachable Proxmox node or a stable Proxmox API endpoint.
# Using the IP avoids local DNS issues during early bootstrap.
#
# Format required by the Packer Proxmox builder:
#   https://<host-or-ip>:8006/api2/json
packer_proxmox_endpoint: "https://10.10.10.14:8006/api2/json"

# Skip Proxmox TLS verification.
#
# Keep true while using the default/self-signed Proxmox certificate.
# Set false later if Proxmox gets a trusted certificate.
packer_proxmox_insecure_skip_tls_verify: true

# Proxmox API token file generated by your token automation.
#
# This file must contain:
#   FULL_TOKENID=<user@realm!token-name>
#   TOKEN_SECRET=<token-secret>
#
# Example:
#   FULL_TOKENID=packer-prov@pve!packer-automation
#   TOKEN_SECRET=<secret>
#
# The role reads this file at runtime and passes values to Packer using:
#   PKR_VAR_proxmox_api_token_id
#   PKR_VAR_proxmox_api_token_secret
#
# Do not commit API token secrets into this group_vars file.
packer_proxmox_api_token_file: "{{ playbook_dir }}/../../.outputs/api-tokens/packer-prov-api-token.txt"

# -----------------------------------------------------------------------------
# Proxmox ISO upload SSH settings
# -----------------------------------------------------------------------------

# User used by Ansible to upload ISO files to each Proxmox node.
#
# Current implementation uploads directly into:
#   /var/lib/vz/template/iso
#
# That path is root-owned on normal Proxmox installs, so root is the simplest
# upload user unless you create a dedicated sudo-capable upload account later.
packer_proxmox_iso_upload_user: root

# Private key used by Ansible SSH/SCP when uploading ISOs.
#
# Use the identity installed under your local user's ~/.ssh directory rather
# than reading directly from .outputs. The .outputs path is generation output;
# ~/.ssh is the active client identity location.
packer_proxmox_iso_upload_identity_file: "{{ lookup('env', 'HOME') }}/.ssh/root/id_ed25519"

# SSH certificate paired with the root upload identity.
#
# render-and-build.yaml should pass this as:
#   -o CertificateFile={{ packer_proxmox_iso_upload_certificate_file }}
#
# If the target node trusts your SSH CA and root principal, this allows
# certificate-based login. If not, the matching public key must exist in:
#   /root/.ssh/authorized_keys
packer_proxmox_iso_upload_certificate_file: "{{ lookup('env', 'HOME') }}/.ssh/root/id_ed25519-cert.pub"

# SSH behavior for ISO upload commands.
#
# accept-new prevents first-connect host key prompts from breaking automation.
# For stricter production behavior, pre-seed known_hosts and set this to yes.
packer_proxmox_iso_upload_strict_host_key_checking: "accept-new"

# SSH connection timeout for ISO upload commands.
packer_proxmox_iso_upload_connect_timeout: 10

# Map Proxmox node names to SSH-reachable IPs or hostnames.
#
# Packer still uses the Proxmox node names:
#   pve-01, pve-03, pve-04, pve-05
#
# Ansible SSH/SCP uses this mapping for upload transport.
#
# This avoids failures when short names like pve-01 do not resolve from dev-01.
packer_proxmox_node_ssh_hosts:
  pve-01: "10.10.10.14"
  # pve-03: "10.10.10.16"
  pve-04: "10.10.10.17"
  pve-05: "10.10.10.18"

packer_proxmox_vm_storage_by_node:
  pve-01: "vm_disks_01"
  # pve-03: "vm_disks_03"
  pve-04: "vm_disks_04"
  pve-05: "vm_disks_05"

# -----------------------------------------------------------------------------
# Proxmox storage
# -----------------------------------------------------------------------------

# Proxmox storage ID where ISO files live.
#
# For default Proxmox installs, ISO files usually live in:
#   local:iso/<filename>
#
# Which maps to:
#   /var/lib/vz/template/iso/<filename>
#
# Confirm available storage IDs with:
#   pvesm status
packer_proxmox_iso_storage: "local"

# Filesystem path on each Proxmox node that backs the ISO storage above.
#
# This must match packer_proxmox_iso_storage.
#
# For storage ID "local", this is normally:
#   /var/lib/vz/template/iso
packer_proxmox_iso_upload_dir: "/var/lib/vz/template/iso"

# Proxmox storage ID where VM disks should be created.
#
# This must exist on every target node or be shared storage visible to every
# target node.
#
# Confirm with:
#   pvesm status
packer_proxmox_vm_storage: "vm_disks_01"

# -----------------------------------------------------------------------------
# Default VM hardware
# -----------------------------------------------------------------------------

# Default memory for generated template build VMs.
#
# Can be overridden per distro using:
#   vm_memory: 4096
packer_vm_memory: 2048

# Default vCPU cores for generated template build VMs.
#
# Can be overridden per distro using:
#   vm_cores: 4
packer_vm_cores: 2

# Default CPU socket count.
packer_vm_sockets: 1

# Default boot disk size.
#
# Can be overridden per distro using:
#   vm_disk_size: "40G"
packer_vm_disk_size: "20G"

# Default Proxmox bridge for the template build VM NIC.
packer_vm_bridge: "vmbr0"

# -----------------------------------------------------------------------------
# Installer defaults
# -----------------------------------------------------------------------------

# Disk used inside the guest installer.
#
# Your Packer HCL uses virtio disk, so Debian/Ubuntu should normally see:
#   /dev/vda
packer_preseed_disk: "/dev/vda"

# Bootloader install target inside the guest installer.
packer_preseed_bootdev: "/dev/vda"

# Domain assigned during unattended installation.
#
# This is separate from the public domain and should match your local lab domain.
packer_preseed_domain: "local.sinlessgamesllc.com"

# Temporary password used during the Packer build.
#
# Debian preseed uses this as the root password.
# Ubuntu autoinstall uses this for the packer/root provisioning password flow.
#
# This is acceptable for short-lived template build automation, but long-term it
# should move to Ansible Vault or another protected secret source.
packer_preseed_root_password: "packer"

# SSH password Packer uses after the OS installer finishes.
#
# Defaults to the same value as packer_preseed_root_password.
# Keep this aligned with preseed/autoinstall user-data.
packer_ssh_password: "packer"

# -----------------------------------------------------------------------------
# Distro definitions
# -----------------------------------------------------------------------------
#
# Each distro entry controls one generated Packer project.
#
# Required keys:
#   name             Unique distro slug used in paths and VM names
#   display_name     Human-readable distro name
#   family           debian or ubuntu
#   release          Release codename
#   installer_type   preseed or autoinstall
#   iso_url          Installer ISO download URL
#
# Optional per-distro hardware overrides:
#   vm_memory
#   vm_cores
#   vm_sockets
#   vm_disk_size
#   vm_bridge
#
# Notes:
#   - pkr_dir is intentionally not defined per distro.
#   - The role generates all Packer files under:
#       {{ packer_root_dir }}/{{ distro.name }}
#   - Debian uses preseed.
#   - Ubuntu Server live installer uses autoinstall / NoCloud.
#   - ISO filenames are derived from iso_url.
#   - ISOs are cached locally, then uploaded to each Proxmox node if missing.

packer_distros:
  - name: debian-12
    display_name: "Debian 12"
    family: debian
    release: bookworm
    installer_type: preseed
    iso_url: "https://cloudfront.debian.net/cdimage/archive/latest-oldstable/amd64/iso-cd/debian-12.13.0-amd64-netinst.iso"

    # Debian preseed metadata.
    preseed_comment: "Minimal Debian 12 preseed - ultra-clean for reliability"

    # Debian package mirror settings used by preseed.cfg.
    preseed_mirror_host: "deb.debian.org"
    preseed_mirror_directory: "/debian"
    preseed_security_path: "/debian-security"

    # Optional per-distro VM sizing.
    # Uncomment if Debian 12 needs different resources from the global defaults.
    # vm_memory: 2048
    # vm_cores: 2
    # vm_sockets: 1
    # vm_disk_size: "20G"
    # vm_bridge: "vmbr0"

  - name: debian-13
    display_name: "Debian 13"
    family: debian
    release: trixie
    installer_type: preseed
    iso_url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.4.0-amd64-netinst.iso"
    # Debian preseed metadata.
    preseed_comment: "Minimal Debian 13 preseed - ultra-clean for reliability"

    # Debian package mirror settings used by preseed.cfg.
    preseed_mirror_host: "deb.debian.org"
    preseed_mirror_directory: "/debian"
    preseed_security_path: "/debian-security"

    # Optional per-distro VM sizing.
    # vm_memory: 2048
    # vm_cores: 2
    # vm_sockets: 1
    # vm_disk_size: "20G"
    # vm_bridge: "vmbr0"

  - name: ubuntu-22.04
    display_name: "Ubuntu 22.04"
    family: ubuntu
    release: jammy
    installer_type: autoinstall
    iso_url: "https://releases.ubuntu.com/22.04/ubuntu-22.04.5-live-server-amd64.iso"

    # Ubuntu autoinstall metadata.
    #
    # The role renders:
    #   http/user-data
    #   http/meta-data
    #   http/vendor-data
    #
    # These fields are still named preseed_* for shared template compatibility,
    # but for Ubuntu they feed the autoinstall/cloud-init templates.
    preseed_comment: "Minimal Ubuntu 22.04 installer config - ultra-clean for reliability"
    preseed_mirror_host: "archive.ubuntu.com"
    preseed_mirror_directory: "/ubuntu"
    preseed_security_path: "/ubuntu"

    # Ubuntu live-server generally benefits from a little more memory during
    # autoinstall than Debian netinst.
    vm_memory: 4096
    vm_cores: 2
    vm_sockets: 1
    vm_disk_size: "25G"
    vm_bridge: "vmbr0"