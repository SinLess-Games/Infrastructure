---
# =============================================================================
# Global User Definitions
# -----------------------------------------------------------------------------
# Purpose:
#   Defines global Linux user accounts managed by Ansible.
#
# Ownership boundaries:
#   - This file defines users, account metadata, sudo policy, groups, shells,
#     SSH certificate principals, and account state.
#   - Linux groups are defined in:
#       Ansible/group_vars/all/groups.yaml
#   - SSH keys should be generated by the ssh role.
#   - SSH authorized keys / certificates should be installed by the users,
#     common_users, or ssh role.
#
# Security model:
#   - sinless777 is the primary human operator account.
#   - ansible is the interactive automation account used for remote execution.
#   - automation is a non-interactive service/ownership account.
#   - root remains declared for explicit policy, but SSH root login should be
#     controlled by the ssh role.
#   - breakglass is locked by default and should only be enabled during a
#     controlled recovery procedure.
#
# Notes:
#   - Prefer snake_case keys so role templates can access values safely.
#   - Avoid plaintext passwords in this file.
#   - Password hashes, if ever needed, should come from Ansible Vault/SOPS.
# =============================================================================

# =============================================================================
# User defaults
# =============================================================================

users_defaults:
  state: present
  create_home: true
  password_lock: true
  sudo: false
  sudo_nopasswd: false
  system: false
  shell: /bin/bash
  append_groups: true
  manage_ssh: true
  manage_sudoers: true

# =============================================================================
# Global users
# =============================================================================

users:
  # ---------------------------------------------------------------------------
  # Primary operator
  # ---------------------------------------------------------------------------

  - name: sinless777
    state: present
    comment: "Primary operator account for SinLess Games LLC infrastructure"
    shell: /usr/bin/zsh
    home_directory: /home/sinless777
    create_home: true
    system: false
    password_lock: false

    primary_group: sinless777
    groups:
      - adm
      - ansible
      - automation
      - certs
      - docker
      - operations
      - security
      - shared-certs
      - sudo
      - terraform

    append_groups: true

    sudo: true
    sudo_nopasswd: true
    sudoers_file: sinless777
    sudo_commands:
      - ALL

    ssh_principals:
      - sinless777
      - admin
      - infrastructure-admin
      - infrastructure-operator

    shared_certs:
      - root

    tags:
      - operator
      - admin
      - interactive
      - privileged

  # ---------------------------------------------------------------------------
  # Ansible remote execution user
  # ---------------------------------------------------------------------------
  # This account exists specifically for Ansible SSH execution. It needs an
  # interactive shell because Ansible modules run remote commands through SSH.
  # Password login should remain disabled; authentication should be SSH-key or
  # SSH-certificate based.
  # ---------------------------------------------------------------------------

  - name: ansible
    state: present
    comment: "Ansible remote execution account"
    shell: /bin/bash
    home_directory: /home/ansible
    create_home: true
    system: false
    password_lock: true

    primary_group: ansible
    groups:
      - adm
      - ansible
      - automation
      - docker
      - operations
      - sudo
      - terraform

    append_groups: true

    sudo: true
    sudo_nopasswd: true
    sudoers_file: ansible
    sudo_commands:
      - ALL

    ssh_principals:
      - ansible
      - automation
      - infrastructure-automation

    tags:
      - ansible
      - automation
      - remote-execution
      - privileged

  # ---------------------------------------------------------------------------
  # Root
  # ---------------------------------------------------------------------------
  # Root is declared so account policy is explicit. Interactive root SSH should
  # still be controlled by the ssh role through PermitRootLogin policy.
  # ---------------------------------------------------------------------------

  - name: root
    state: present
    comment: "Root account"
    shell: /bin/bash
    home_directory: /root
    create_home: false
    system: true
    password_lock: false

    groups:
      - adm
      - certs
      - shared-certs
      - sudo

    append_groups: true

    sudo: true
    sudo_nopasswd: true
    manage_sudoers: false

    ssh_principals:
      - root
      - admin
      - infrastructure-root

    tags:
      - root
      - privileged
      - protected

  # ---------------------------------------------------------------------------
  # Non-interactive automation service account
  # ---------------------------------------------------------------------------
  # This account is for file ownership, local automation, CI-owned artifacts, and
  # service-level access. It is not intended for normal SSH execution.
  # ---------------------------------------------------------------------------

  - name: automation
    state: present
    comment: "Non-interactive automation service account for CI, GitOps, and
      Terraform ownership"
    shell: /usr/sbin/nologin
    home_directory: /var/lib/automation
    create_home: true
    system: true
    password_lock: true

    primary_group: automation
    groups:
      - automation
      - docker
      - gitops
      - terraform

    append_groups: true

    sudo: true
    sudo_nopasswd: true
    sudoers_file: automation
    sudo_commands:
      - ALL

    ssh_principals:
      - automation
      - gitops
      - terraform

    tags:
      - automation
      - ci
      - gitops
      - terraform
      - noninteractive

  # ---------------------------------------------------------------------------
  # Break-glass emergency account
  # ---------------------------------------------------------------------------
  # This account is intentionally locked by default. Unlock only during an
  # approved emergency recovery process. Unlike normal automation/admin users,
  # this account should require a password if enabled.
  # ---------------------------------------------------------------------------

  - name: breakglass
    state: present
    comment: "Emergency break-glass access account"
    shell: /bin/bash
    home_directory: /home/breakglass
    create_home: true
    system: false
    password_lock: true

    primary_group: breakglass
    groups:
      - adm
      - breakglass
      - sudo

    append_groups: true

    sudo: true
    sudo_nopasswd: false
    sudoers_file: breakglass
    sudo_commands:
      - ALL

    ssh_principals:
      - breakglass
      - emergency-access
      - infrastructure-breakglass

    tags:
      - breakglass
      - emergency
      - locked
      - privileged

# =============================================================================
# User policy metadata
# -----------------------------------------------------------------------------
# Optional helper metadata for validation tasks.
# =============================================================================

users_policy:
  require_unique_names: true
  require_no_plaintext_passwords: true
  require_snake_case_keys: true
  require_explicit_state: true
  require_explicit_shell: true
  require_explicit_password_lock: true
  require_explicit_sudo_policy: true

  allowed_interactive_shells:
    - /bin/bash
    - /usr/bin/bash
    - /bin/zsh
    - /usr/bin/zsh

  allowed_noninteractive_shells:
    - /usr/sbin/nologin
    - /sbin/nologin
    - /bin/false
    - /usr/bin/false

  protected_users:
    - root
    - sinless777
    - ansible
    - breakglass

  interactive_users:
    - sinless777
    - ansible
    - breakglass

  noninteractive_users:
    - automation

  sudo_users:
    - sinless777
    - ansible
    - automation
    - breakglass

  passwordless_sudo_users:
    - sinless777
    - ansible
    - automation

  locked_by_default:
    - ansible
    - automation
    - breakglass

  ssh_certificate_users:
    - root
    - sinless777
    - ansible
    - automation
    - breakglass

  default_admin_groups:
    - sudo
    - adm

  default_automation_groups:
    - ansible
    - automation
    - gitops
    - terraform

  default_security_groups:
    - security
    - certs
    - shared-certs
