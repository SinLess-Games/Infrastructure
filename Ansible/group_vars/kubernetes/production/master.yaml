---
# =============================================================================
# Kubernetes Production Cluster Variables - Control Plane
# =============================================================================

kubernetes_control_plane_group_name: "kubernetes_prod_control_plane"
kubernetes_control_plane_first_host: "rke2-prod-cp-01"
kubernetes_control_plane_first_ip: "10.10.40.11"

kubernetes_rke2_cluster_group_name: "kubernetes_prod"
kubernetes_rke2_servers_group_name: "kubernetes_prod_control_plane"
kubernetes_rke2_agents_group_name: "kubernetes_prod_workers"

# =============================================================================
# RKE2 Server Node Labels
# =============================================================================
# These labels are applied to all production control-plane nodes.
# Host-specific labels such as topology.kubernetes.io/zone should be applied
# from the inventory/node-specific vars so each control-plane node receives
# the correct Proxmox host/zone value.

kubernetes_rke2_server_node_labels:
  - "sinlessgames.com/role=control-plane"
  - "sinlessgames.com/environment=prod"
  - "sinlessgames.com/cluster=rke2-prod"
  - "sinlessgames.com/region=homelab-prod"
  - "node.sinlessgames.io/role=control-plane"
  - "node.sinlessgames.io/workload-policy=system-only"

# =============================================================================
# RKE2 Server Node Taints
# =============================================================================
# Keep application workloads off the control plane.
# Only system workloads with explicit tolerations should schedule here.

kubernetes_rke2_server_node_taints:
  - "node-role.kubernetes.io/control-plane=true:NoSchedule"

# =============================================================================
# RKE2 API Server TLS SANs
# =============================================================================
# Include the production API VIP, public/internal API DNS name, and all
# control-plane node names/IPs so kubectl, kubelets, and HA failover continue
# to work cleanly.

kubernetes_rke2_server_tls_sans:
  - "{{ kubernetes_api_vip }}"
  - "{{ kubernetes_api_fqdn }}"

  # Control-plane IPs
  - "10.10.40.11"
  - "10.10.40.12"
  - "10.10.40.13"

  # Control-plane hostnames
  - "rke2-prod-cp-01"
  - "rke2-prod-cp-02"
  - "rke2-prod-cp-03"

  # Control-plane FQDNs
  - "rke2-prod-cp-01.prod.k8s.sinlessgames.com"
  - "rke2-prod-cp-02.prod.k8s.sinlessgames.com"
  - "rke2-prod-cp-03.prod.k8s.sinlessgames.com"

# =============================================================================
# Production Control-Plane Safety Settings
# =============================================================================

kubernetes_rke2_control_plane_schedulable: false
kubernetes_rke2_etcd_snapshot_enabled: true
kubernetes_rke2_etcd_snapshot_schedule_cron: "0 */6 * * *"
kubernetes_rke2_etcd_snapshot_retention: 28
kubernetes_rke2_etcd_snapshot_dir: "/var/lib/rancher/rke2/server/db/snapshots"

# =============================================================================
# Production Control-Plane Kubelet Reservations
# =============================================================================
# These protect the host and RKE2 system services from workload pressure.

kubernetes_rke2_server_kubelet_args:
  - "system-reserved=cpu=500m,memory=1Gi,ephemeral-storage=2Gi"
  - "kube-reserved=cpu=500m,memory=1Gi,ephemeral-storage=2Gi"
  - "eviction-hard=memory.available<500Mi,nodefs.available<10%,imagefs.available<10%"
  - "eviction-soft=memory.available<1Gi,nodefs.available<15%,imagefs.available<15%"
  - "eviction-soft-grace-period=memory.available=1m,nodefs.available=2m,imagefs.available=2m"
  - "max-pods=80"

# =============================================================================
# Production API Server Arguments
# =============================================================================

kubernetes_rke2_server_kube_apiserver_args:
  - "anonymous-auth=false"
  - "profiling=false"
  - "audit-log-path=/var/lib/rancher/rke2/server/logs/audit.log"
  - "audit-log-maxage=30"
  - "audit-log-maxbackup=10"
  - "audit-log-maxsize=100"
  - "request-timeout=300s"

# =============================================================================
# Production Controller Manager Arguments
# =============================================================================

kubernetes_rke2_server_kube_controller_manager_args:
  - "profiling=false"
  - "terminated-pod-gc-threshold=12500"

# =============================================================================
# Production Scheduler Arguments
# =============================================================================

kubernetes_rke2_server_kube_scheduler_args:
  - "profiling=false"